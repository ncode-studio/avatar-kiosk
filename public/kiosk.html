// ─── Push-To-Talk ─────────────────────────────────────────────────────────────
function updatePttBtn(viewportW) {
  const btn = document.getElementById('ptt-btn');
  if (!btn) return;

  if (!CONFIG.pttEnabled) {
    btn.style.display = 'none';
    return;
  }


  const isMobile = (viewportW ?? window.innerWidth) <= 600;
  const _rawSz = (CONFIG.pttIconSize ?? 0) || (CONFIG.micIconSize ?? 44);
  const sz = Math.round(_rawSz * (isMobile ? 0.65 : 1));
  btn.style.setProperty('width',  sz + 'px', 'important');
  btn.style.setProperty('height', sz + 'px', 'important');
  document.documentElement.style.setProperty('--ptt-mobile-size', sz + 'px');
  if (isMobile) {
    btn.style.bottom    = '30px';
    btn.style.left      = '50%';
    btn.style.right     = '';
    btn.style.transform = 'translateX(-50%)';
    btn.style.top       = '';
  } else {
    // Desktop: parte dalla posizione del mic, offset x/y dedicati PTT
    const baseTop   = 20 + (CONFIG.micIconY  ?? 0);
    const baseRight = 32 - (CONFIG.micIconX  ?? 0);
    const finalTop   = Math.max(5, baseTop  + (CONFIG.pttIconY ?? 0));
    const finalRight = Math.max(1, baseRight - (CONFIG.pttIconX ?? 0));
    btn.style.top       = finalTop + 'px';
    btn.style.right     = (finalRight / 1080 * 100).toFixed(4) + 'vw';
    btn.style.left      = '';
    btn.style.bottom    = '';
    btn.style.transform = '';
  }

  const iconEl = document.getElementById('ptt-icon-img');
  const fallEl = document.getElementById('ptt-icon-fallback');
  const waveEl = document.getElementById('ptt-wave');
  const mode  = state.mode;
  const ts    = CONFIG._iconTs || '';
  const icoSz = Math.round(sz * 0.64) + 'px';

  const _alphaOf = c => { const m = c.match(/[\d.]+\)$/); return m ? Math.round(parseFloat(m[0]) * 100) : 15; };
  const _themeColor = (base, fallback) => {
    const c = base || fallback; return `color-mix(in srgb, var(--accent) ${_alphaOf(c)}%, transparent)`;
  };
  const _showIcon = () => {
    if (waveEl) waveEl.style.display = 'none';
    if (iconEl) iconEl.style.opacity = '';
    if (fallEl) fallEl.style.opacity = '';
    const ico = CONFIG.pttIcon || CONFIG.micIcon;
    if (ico) {
      if (iconEl) { iconEl.src = `/${ico}?t=${ts}`; iconEl.style.setProperty('width', icoSz, 'important'); iconEl.style.setProperty('height', icoSz, 'important'); iconEl.style.display = 'block'; iconEl.style.filter = 'none'; }
      if (fallEl) fallEl.style.display = 'none';
    } else {
      if (iconEl) iconEl.style.display = 'none';
      if (fallEl) { fallEl.textContent = '🎙'; fallEl.style.setProperty('font-size', icoSz, 'important'); fallEl.style.display = ''; }
    }
  };
  const _showWave = () => {
    if (waveEl) waveEl.style.display = 'flex';
    if (iconEl) iconEl.style.opacity = '0';
    if (fallEl) fallEl.style.opacity = '0';
  };

  if (mode === 'speaking') {
    btn.style.background  = CONFIG.pttBgColor || CONFIG.audioBgColor  || 'rgba(34,211,160,.15)';
    btn.style.borderColor = CONFIG.pttBorderColor || CONFIG.audioBorderColor || 'rgba(34,211,160,.5)';
    _showWave();
  } else if (mode === 'listening') {
    // Wakeword rilevata: colore tema + waveform immediata
    btn.style.background  = _themeColor(CONFIG.pttBgColor  || CONFIG.micBgColor,  'rgba(34,211,160,.15)');
    btn.style.borderColor = _themeColor(CONFIG.pttBorderColor || CONFIG.micBorderColor, 'rgba(34,211,160,.5)');
    _showWave();
  } else if (mode === 'recording') {
    // PTT premuto: colore tema + icona (waveform solo se voce rilevata)
    btn.style.background  = _themeColor(CONFIG.pttBgColor  || CONFIG.micBgColor,  'rgba(34,211,160,.15)');
    btn.style.borderColor = _themeColor(CONFIG.pttBorderColor || CONFIG.micBorderColor, 'rgba(34,211,160,.5)');
    if (_pttVoiceActive) { _showWave(); } else { _showIcon(); }
  } else {
    // Idle / thinking: colori normali, icona
    btn.style.background  = CONFIG.pttBgColor || CONFIG.micBgColor || 'rgba(34,211,160,.15)';
    btn.style.borderColor = CONFIG.pttBorderColor || CONFIG.micBorderColor || 'rgba(34,211,160,.5)';
    _showIcon();
  }
  btn.style.display = 'flex';
}

// PTT tramite SpeechRecognition (come la wakeword)
let _pttRecognition = null;
let _pttFinalText = '';
let _pttInterimText = '';
let _pttStartedAt = 0;
let _pttStopPending = false; // pointerup arrivato prima che _pttStart finisse
let _pttVoiceActive = false; // voce rilevata dalla SpeechRecognition

async function _pttStart() {
  _pttStopPending = false;
  if (state.mode === 'speaking') { stopCurrentAudio(); return; }
  if (state.mode === 'thinking' || state.mode === 'recording') return;

  // Se siamo in idle, fare wakeUp per inizializzare la sessione e avviare la wakeword
  const overlay = document.getElementById('idle-overlay');
  if (overlay && !overlay.classList.contains('hidden')) await wakeUp();

  // Ferma sempre la wakeword: due SpeechRecognition parallele consumano lo stesso mic
  stopWakeWord();

  // Sblocca AudioContext su iOS (richiede gesto utente)
  try {
    if (!_lipAudioCtx) _lipAudioCtx = new AudioContext();
    if (_lipAudioCtx.state === 'suspended') await _lipAudioCtx.resume();
  } catch (_) {}

  // Prima volta: nascondi idle overlay
  const idleOverlay = document.getElementById('idle-overlay');
  if (!idleOverlay.classList.contains('hidden')) {
    idleOverlay.classList.add('hidden');
    setControlsVisible(true);
    if (CONFIG.greetingText.trim()) {
      const gt = CONFIG.greetingText.replace(/\{\{nome\}\}/gi, CONFIG.avatarName).replace(/\{\{sessionID\}\}/gi, state.kioskSessionId);
      setTimeout(() => addToHistory('avatar', gt), 50);
    }
    resetIdleTimer();
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { console.warn('[PTT] SpeechRecognition non supportato'); return; }

  if (_pttRecognition) { try { _pttRecognition.abort(); } catch(_) {} }

  _pttFinalText = '';
  _pttInterimText = '';
  _pttStartedAt = Date.now();
  _pttVoiceActive = false;

  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = CONFIG.sttLanguage || 'it-IT';
  _pttRecognition = rec;

  rec.onresult = e => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) { _pttFinalText += final; _pttInterimText = ''; }
    else if (interim) _pttInterimText = interim;
    // Mostra waveform al primo segnale vocale
    if (!_pttVoiceActive) { _pttVoiceActive = true; updatePttBtn(); }
  };

  rec.onerror = e => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') console.warn('[PTT] SR errore:', e.error);
  };

  rec.onend = () => {};

  try { rec.start(); } catch(e) { console.warn('[PTT] start errore:', e); setMode('listening'); return; }
  setMode('recording');
  // Se pointerup era già arrivato durante await wakeUp(), stoppa subito
  if (_pttStopPending) { _pttStopPending = false; _pttStop(); return; }
}

function _pttStop() {
  _pttStopPending = false;
  _pttVoiceActive = false;
  const btn = document.getElementById('ptt-btn');
  if (btn) { btn.classList.remove('ptt-pressing'); btn.style.transform = (window.innerWidth <= 600 ? 'translateX(-50%)' : ''); updatePttBtn(); }
  if (!_pttRecognition) { _pttStopPending = true; return; } // start non ancora completato
  const rec = _pttRecognition;
  _pttRecognition = null;

  rec.onend = () => {
    const text = (_pttFinalText + ' ' + _pttInterimText).trim();
    const duration = Date.now() - _pttStartedAt;
    if (!text || duration < 300) { setMode('listening'); return; }
    setMode('thinking');
    processUserInput(text);
  };
  setTimeout(() => { try { rec.stop(); } catch(_) {} }, CONFIG.vadWakeTimeout ?? 5000);
}

function _initPttListeners() {
  const btn = document.getElementById('ptt-btn');
  if (!btn) return;
  btn.addEventListener('pointerdown', e => {
    if (!CONFIG.pttEnabled) return;
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    _pttStart();
  });
  btn.addEventListener('pointerup',     e => { if (CONFIG.pttEnabled) _pttStop(); });
  btn.addEventListener('pointercancel', e => { if (CONFIG.pttEnabled) _pttStop(); });

  // In PTT mode blocca il click sull'idle overlay solo se non siamo in idle
  const overlay = document.getElementById('idle-overlay');
  if (overlay) {
    overlay.addEventListener('click', e => {
      if (CONFIG.pttEnabled && overlay.classList.contains('hidden')) e.stopImmediatePropagation();
    }, true);
  }
}

async function toggleMic() {
  CONFIG.micEnabled = !CONFIG.micEnabled;
  console.log('[toggleMic] micEnabled:', CONFIG.micEnabled, 'mode:', state.mode, 'wakeAlways:', CONFIG.wakeWordAlwaysRequired, 'wakeRec:', !!state.wakeRecognition);
  updateMicBtn();
  if (CONFIG.micEnabled) {
    if (state.mode !== 'idle' || (!CONFIG.wakeWordAlwaysRequired && !CONFIG.wakeWordEnabled)) await _startVad();
    if (CONFIG.wakeWordAlwaysRequired && state.mode !== 'idle') startWakeWord();
    console.log('[toggleMic] dopo startWakeWord, wakeRec:', !!state.wakeRecognition);
  } else {
    const vad = state.vad;
    state.vad = null;
    if (state.mode === 'recording') {
      // Stava registrando: aspetta che il blob venga consegnato all'AI prima di fermare
      const origOnSpeechEnd = vad.onSpeechEnd;
      vad.onSpeechEnd = async blob => {
        await origOnSpeechEnd(blob);
        vad.stop();
      };
      vad._forceStop();
    } else {
      vad?.stop();
    }
  }
}

async function _startVad() {
  try {
    state.vad = new VAD({
      threshold:         CONFIG.vadThreshold,
      silenceDuration:   CONFIG.vadSilenceDuration,
      minSpeechDuration: CONFIG.vadMinSpeechDuration,
      onVolume:    rms => updateVadVisualizer(rms),
      onSpeechStart: () => {
        clearTimeout(state._wakeTimeout);
        if (state.mode === 'idle' && !CONFIG.wakeWordAlwaysRequired && !CONFIG.wakeWordEnabled) {
          // Free-talk puro: entra in sessione automaticamente al primo parlato
          wakeUp().then(() => setMode('recording'));
          return;
        } else if (state.mode === 'listening') {
          if (CONFIG.wakeWordAlwaysRequired && !state.wakeActivated) return;
          state.wakeActivated = false;
          setMode('recording');
        } else if (state.mode === 'speaking') {
          if (CONFIG.wakeWordAlwaysRequired) {
            // Ferma TTS; il recorder NON è partito (recordingEnabled=false)
            // Dopo 300ms abilita la registrazione per catturare la domanda successiva
            state.wakeActivated = true;
            stopCurrentAudio();
            setMode('recording');
            clearTimeout(state._wakeTimeout);
            setTimeout(() => {
              if (state.vad && state.wakeActivated) {
                state.vad.recordingEnabled = true;
                // Se VAD sta già rilevando voce ma recorder non è partito, avvialo ora
                if (state.vad._speaking && state.vad._recorder?.state === 'inactive') {
                  state.vad._chunks = [];
                  try { state.vad._recorder.start(); } catch(_) {}
                }
              }
            }, 300);
            state._wakeTimeout = setTimeout(() => {
              if (state.mode === 'recording' && state.wakeActivated) {
                state.wakeActivated = false;
                if (state.vad) state.vad.recordingEnabled = false;
                setMode('listening');
              }
            }, CONFIG.vadWakeTimeout);
          } else {
            // Free-talk: barge-in diretto
            state.bargeIn = true;
            stopCurrentAudio();
            setMode('recording');
          }
        }
      },
      onSpeechEnd: async blob => {
        console.log('[VAD] onSpeechEnd blob.size:', blob.size, 'mode:', state.mode, 'wakeActivated:', state.wakeActivated);
        if (state.mode === 'recording') {
          if (CONFIG.wakeWordAlwaysRequired && !state.wakeActivated && !state.bargeIn) {
            setMode('listening');
            return;
          }
          if (blob.size < CONFIG.vadMinBlobSize) {
            if (state.wakeActivated) return; // rumore residuo dopo wake word: resta in recording
            state.bargeIn = false;
            setMode('listening');
            if (CONFIG.wakeWordAlwaysRequired) startWakeWord();
            return;
          }
          state.wakeActivated = false;
          state.bargeIn = false;
          setMode('thinking');
          await transcribeAndProcess(blob);
        }
      },
    });
    await state.vad.start();
    // Se wakeWordAlwaysRequired: recorder disabilitato finché wake word non attiva
    // (non sovrascrivere se la wake word è già scattata mentre il VAD stava caricando)
    if (CONFIG.wakeWordAlwaysRequired && !state.wakeActivated) state.vad.recordingEnabled = false;
    // Se il mic è stato spento mentre getUserMedia era in attesa, ferma subito
    if (!CONFIG.micEnabled) { state.vad.stop(); state.vad = null; }
  } catch (err) {
    console.warn('⚠️ Mic non disponibile:', err);
  }
}

function setControlsVisible(visible) {
  document.body.classList.toggle('idle-hidden', !visible);
}

async function wakeUp() {
  const comingFromIdle = !document.getElementById('idle-overlay').classList.contains('hidden');

  stopWakeWord();
  document.getElementById('idle-overlay').classList.add('hidden');
  setControlsVisible(true);
  setMode('listening');
  resetIdleTimer();

  // Sblocca AudioContext su iOS durante il gesto utente
  try {
    if (!_lipAudioCtx) _lipAudioCtx = new AudioContext();
    if (_lipAudioCtx.state === 'suspended') await _lipAudioCtx.resume();
    const buf = _lipAudioCtx.createBuffer(1, 1, 22050);
    const src = _lipAudioCtx.createBufferSource();
    src.buffer = buf; src.connect(_lipAudioCtx.destination); src.start(0);
  } catch (_) {}

  // Avvia VAD solo se il mic è abilitato (non riabilitare mai se l'utente l'ha spento)
  if (CONFIG.micEnabled) {
    if (!state.vad) await _startVad();
    else state.vad.resume();
  }

  if (comingFromIdle && CONFIG.greetingText.trim() && CONFIG.audioEnabled) {
    // Casi 4,5,6: presentazione TTS — ferma recognition per evitare self-listening
    stopWakeWord();
    const greetingText = CONFIG.greetingText
      .replace(/\{\{nome\}\}/gi, CONFIG.avatarName)
      .replace(/\{\{sessionID\}\}/gi, state.kioskSessionId);
    addToHistory('avatar', greetingText);
    setMode('speaking');
    state.vad?.pause();
    try {
      const ttsRes = await fetch(`${CONFIG.serverUrl}/api/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: greetingText, avatarId: CONFIG.avatarId }),
      });
      if (ttsRes.ok) {
        const ttsData = await ttsRes.json();
        stopCurrentAudio(); startProceduralLipSync();
        await playTTSAudio(ttsData);
      }
    } catch(_) {}
    stopProceduralLipSync(); anim.lipTarget = 0;
    state.vad?.resume();
    setMode('listening');
  } else if (comingFromIdle && CONFIG.greetingText.trim()) {
    // audioEnabled=false: solo testo
    const greetingText = CONFIG.greetingText
      .replace(/\{\{nome\}\}/gi, CONFIG.avatarName)
      .replace(/\{\{sessionID\}\}/gi, state.kioskSessionId);
    setTimeout(() => addToHistory('avatar', greetingText), 50);
  }
  // Casi 1,2,3 (idleDisabled=true, comingFromIdle=false): nessuna presentazione, chat subito attiva

  state.wakeActivated = false;
  state.bargeIn = false;
  if (CONFIG.wakeWordAlwaysRequired) {
    if (state.vad) state.vad.recordingEnabled = false;
    startWakeWord();
  }
  resetIdleTimer();
  console.log('[wakeUp] done — mode:', state.mode, 'micEnabled:', CONFIG.micEnabled, 'wakeAlways:', CONFIG.wakeWordAlwaysRequired);
}

// ═══════════════════════════════════════════════════════════════════════════
//  PANNELLO IMPOSTAZIONI AVATAR
// ═══════════════════════════════════════════════════════════════════════════
function toggleSettings() {
  const body = document.getElementById('settings-body');
  const isOpen = body.classList.toggle('open');
  // Quando si chiude il pannello, esci dallo scrub mode
  if (!isOpen) exitScrubMode();
}

function exitScrubMode() {
  if (!state._isScrubbing) return;
  state._isScrubbing = false;
  if (_scrubPlaying) {
    clearInterval(_scrubInterval);
    _scrubPlaying = false;
    document.getElementById('scrub-play-btn').textContent = '▶ Play';
  }
  // Distruggi mixer scrub — verrà ricreato al prossimo scrub
  if (state._scrubMixer) {
    state._scrubMixer.stopAllAction();
    state._scrubMixer = null;
    state._scrubAction = null;
  }
  // Ripristina azione principale
  if (state.mainAction) {
    state.mainAction.paused    = false;
    state.mainAction.weight    = 1;
    state.mainAction.timeScale = 1;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  SCRUBBER ANIMAZIONE
// ═══════════════════════════════════════════════════════════════════════════
const _range = { start: null, end: null };
let _scrubPlaying = false;
let _scrubInterval = null;

// Range animazione
const ANIM_RANGE = {
  idleStart:   0.0,
  idleEnd:     2.65,
  speechStart: 2.65,
  speechEnd:   9.04,
};

function initScrubber() {
  if (!state._fullClip) return;
  const dur = state._fullClip.duration;

  // Scrubber esplorazione
  const scrubber = document.getElementById('anim-scrubber');
  scrubber.max   = dur;
  scrubber.step  = 0.01;
  scrubber.value = 0;
  document.getElementById('val-anim-dur').textContent  = dur.toFixed(2);
  document.getElementById('val-anim-time').textContent = '0.00';

  // Slider range — max = durata clip
  ['speech-start-slider','speech-end-slider','rest-time-slider'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.max = dur.toFixed(2);
  });
}

function updateAnimRange(key, value) {
  const v = parseFloat(value);
  ANIM_RANGE[key] = v;
  const labelMap = {
    idleStart: 'val-idle-start', idleEnd: 'val-idle-end',
    speechStart: 'val-speech-start', speechEnd: 'val-speech-end',
  };
  document.getElementById(labelMap[key]).textContent = v.toFixed(2);
}

function applyAnimRange() {
  const { idleStart, idleEnd, speechStart, speechEnd } = ANIM_RANGE;
  if (idleStart >= idleEnd) {
    document.getElementById('anim-range-info').textContent = '⚠️ Idle Start deve essere < Idle End'; return;
  }
  if (speechStart >= speechEnd) {
    document.getElementById('anim-range-info').textContent = '⚠️ Speech Start deve essere < Speech End'; return;
  }
  // I range vengono applicati direttamente nel render loop — nessun subclip
  document.getElementById('anim-range-info').textContent =
    `✅ Idle ${idleStart.toFixed(2)}→${idleEnd.toFixed(2)}s | Speech ${speechStart.toFixed(2)}→${speechEnd.toFixed(2)}s`;
}

function scrubAnimation(value) {
  if (!state._fullClip || !state.avatar) return;
  const t = parseFloat(value);

  // Mixer dedicato allo scrub — creato una volta sola
  if (!state._scrubMixer) {
    state._scrubMixer  = new THREE.AnimationMixer(state.avatar);
    state._scrubAction = state._scrubMixer.clipAction(state._fullClip);
    state._scrubAction.setLoop(THREE.LoopOnce, 1);
    state._scrubAction.clampWhenFinished = true;
    state._scrubAction.play();
  }

  // Pausa il mixer principale
  if (!state._isScrubbing) {
    if (state.mainAction) state.mainAction.paused = true;
    state._isScrubbing = true;
  }

  // Porta il mixer scrub al frame desiderato
  state._scrubMixer.setTime(t);
  document.getElementById('val-anim-time').textContent = t.toFixed(2);
}

function toggleScrubPlay() {
  const btn = document.getElementById('scrub-play-btn');

  if (_scrubPlaying) {
    // Stop — ripristina animazioni normali
    clearInterval(_scrubInterval);
    _scrubPlaying = false;
    btn.textContent = '▶ Play';
    if (state._scrubAction) { state._scrubAction.weight = 0; state._scrubAction.timeScale = 0; }
    if (state.mainAction) { state.mainAction.weight = 1; state.mainAction.timeScale = 1; }
    state._isScrubbing = false;
    return;
  }

  // Verifica range
  if (_range.start === null || _range.end === null) {
    document.getElementById('anim-range-info').textContent = '⚠️ Segna prima Start e End';
    return;
  }
  if (_range.start >= _range.end) {
    document.getElementById('anim-range-info').textContent = '⚠️ Start deve essere < End';
    return;
  }

  // Inizializza scrub mixer se necessario
  if (!state._scrubMixer && state._fullClip && state.avatar) {
    state._scrubMixer  = new THREE.AnimationMixer(state.avatar);
    state._scrubAction = state._scrubMixer.clipAction(state._fullClip);
    state._scrubAction.setLoop(THREE.LoopRepeat, Infinity);
    state._scrubAction.play();
  }

  // Parti dall'inizio del range
  state._scrubMixer?.setTime(_range.start);

  // Pausa il mixer principale
  if (state.mainAction) state.mainAction.paused = true;
  state._isScrubbing = true;

  _scrubPlaying = true;
  btn.textContent = '⏸ Stop';

  const scrubber = document.getElementById('anim-scrubber');
  let _scrubTime = _range.start;
  _scrubInterval = setInterval(() => {
    _scrubTime += 0.033;
    if (_scrubTime >= _range.end) _scrubTime = _range.start;
    state._scrubMixer?.setTime(_scrubTime);
    scrubber.value = _scrubTime;
    document.getElementById('val-anim-time').textContent = _scrubTime.toFixed(2);
  }, 33);
}

function markRange(type) {
  const scrubber = document.getElementById('anim-scrubber');
  const t = parseFloat(scrubber.value);
  _range[type] = parseFloat(t.toFixed(3));
  document.getElementById(type === 'start' ? 'lbl-start' : 'lbl-end').textContent = t.toFixed(3);
}

function applyRangeTo(target) {
  if (_range.start === null || _range.end === null) {
    document.getElementById('anim-range-info').textContent = '⚠️ Segna prima Start e End';
    return;
  }
  const s = _range.start, e = _range.end;
  if (target === 'idle') {
    ANIM_RANGE.idleStart = s; ANIM_RANGE.idleEnd = e;
    document.getElementById('idle-start-slider').value     = s;
    document.getElementById('idle-end-slider').value       = e;
    document.getElementById('val-idle-start').textContent  = s.toFixed(2);
    document.getElementById('val-idle-end').textContent    = e.toFixed(2);
  } else {
    ANIM_RANGE.speechStart = s; ANIM_RANGE.speechEnd = e;
    document.getElementById('speech-start-slider').value    = s;
    document.getElementById('speech-end-slider').value      = e;
    document.getElementById('val-speech-start').textContent = s.toFixed(2);
    document.getElementById('val-speech-end').textContent   = e.toFixed(2);
  }
  // Esci dallo scrub ed applica i subclip
  exitScrubMode();
  applyAnimRange();
  document.getElementById('anim-range-info').textContent =
    `✅ ${target === 'idle' ? '💤 Idle' : '🗣 Speech'}: ${s.toFixed(2)}→${e.toFixed(2)}s applicato`;
}

function copyRangeConfig() {
  if (_range.start === null || _range.end === null) {
    document.getElementById('anim-range-info').textContent = '⚠️ Segna prima Start e End';
    return;
  }
  const txt = `// Range animazione selezionato\nconst subClip = THREE.AnimationUtils.subclip(\n  gltf.animations[0], 'nome', ${_range.start}, ${_range.end}\n);`;

}

  e.preventDefault();

async function uploadFbx(file) {
  if (!file || !file.name.toLowerCase().endsWith('.fbx')) {
    setFbxStatus('error', '⚠️ Seleziona un file .fbx');
    return;
  }
  setFbxStatus('loading', `⏳ Conversione di ${file.name}...`);

  const form = new FormData();
  form.append('model', file);

  try {
    const res  = await fetch('/api/upload-avatar', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    setFbxStatus('ok', '✅ Modello caricato! Ricarico...');
    setTimeout(() => reloadAvatar(), 800);
  } catch (err) {
    setFbxStatus('error', '❌ ' + err.message);
  }
}

  const el = document.getElementById('fbx-status');
  el.className = type;
  el.textContent = msg;
}

function reloadAvatar() {
  // Rimuove il vecchio avatar e carica il nuovo GLB

    scene.remove(state.avatar);
    state.avatar = null;
    state.mixer  = null;
    state.mainAction = null;

function updateAvatarParam(key, value, labelId, liveUpdate) {
  const v = parseFloat(value);
  CONFIG[key] = v;
  document.getElementById(labelId).textContent = v.toFixed(2);
  if (!state.avatar) return;

  if (key === 'avatarScale') {
    // Ricalcola scala
    const box = new THREE.Box3().setFromObject(state.avatar);
    const size = box.getSize(new THREE.Vector3());
    const panelH = document.getElementById('avatar-panel').clientHeight || window.innerHeight;
    const visibleH = 2 * Math.tan((45 / 2) * Math.PI / 180) * camera.position.z;
    const scale = (visibleH * v) / (size.y / state.avatar.scale.x);
    state.avatar.scale.setScalar(scale);
    anim.baseY = state.avatar.position.y;
  } else if (key === 'avatarOffsetX') {
    state.avatar.position.x = v;
  } else if (key === 'avatarOffsetY') {
    state.avatar.position.y = v;
    anim.baseY = v;
  } else if (key === 'avatarRotY') {
    state.avatar.rotation.y = v;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  CARICAMENTO MODELLO GLB
// ═══════════════════════════════════════════════════════════════════════════
function loadGLBAvatar(url) {
  const loader = new THREE.GLTFLoader();
  try {
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('/lib/draco/');
    loader.setDRACOLoader(draco);
  } catch(_) {}

  // Richiesta HEAD per ottenere dimensione file e calcolare % reale
  let _glbTotal = 0;
  fetch(url, { method: 'HEAD' }).then(r => {
    _glbTotal = parseInt(r.headers.get('content-length') || '0');
  }).catch(() => {});

  loader.load(
    url,
    gltf => {
      const model = gltf.scene;

      // Scala il modello per riempire il canvas
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Usa l'altezza del pannello avatar come riferimento
      const panelH = document.getElementById('avatar-panel').clientHeight || window.innerHeight;
      const panelW = document.getElementById('avatar-panel').clientWidth  || window.innerWidth * 0.6;

      // Converti pixel in unità world: la camera vede ~2.4 unità in altezza a distanza 3
      const visibleH = 2 * Math.tan((45 / 2) * Math.PI / 180) * camera.position.z;
      const visibleW = visibleH * (panelW / panelH);
      const targetH  = visibleH * CONFIG.avatarScale;
      const scale    = targetH / size.y;

      console.log('[Avatar load] size:', size, '| box.min.y:', box.min.y.toFixed(4), '| scale:', scale.toFixed(6), '| visibleH:', visibleH.toFixed(3), '| targetH:', targetH.toFixed(3));

      model.scale.setScalar(scale);
      model.position.x = -center.x * scale + CONFIG.avatarOffsetX;
      model.position.z = -center.z * scale + CONFIG.avatarOffsetZ;
      model.position.y = -box.min.y * scale + CONFIG.avatarOffsetY;
      model.rotation.y = CONFIG.avatarRotY;

      // Nascondi shadow plane / ground disc da conversione assimp
      model.traverse(o => {
        if (!o.isMesh) return;
        o.geometry.computeBoundingBox();
        const s = o.geometry.boundingBox.getSize(new THREE.Vector3());
        const flatRatio = s.y / Math.max(s.x, s.z, 0.0001);
        const isFlat = flatRatio < 0.02;
        const isShadowName = /shadow|ground|plane|circle|disc|floor/i.test(o.name);
        if (isFlat || isShadowName) {
          o.visible = false;
          console.log('[Avatar] nascosto mesh:', o.name, 'flatRatio:', flatRatio.toFixed(5));
        }
      });

      scene.add(model);
      state.avatar = model;
      anim.baseY = model.position.y;

      // Trova bone e morph target per lip sync
      model.traverse(o => {
        if (o.isBone) {
          const n = o.name.replace(/mixamorig\w*:/i, '').replace(/mixamorig\w*_/i, '');
          if (n === 'Head')  anim.bones.head  = o;
          if (n === 'Neck')  anim.bones.neck  = o;
          if (n === 'Spine') anim.bones.spine = o;
          if (n === 'Hips')  anim.bones.hips  = o;
          // Opzione A: jaw bone
          if (/^jaw$/i.test(n)) anim.bones.jaw = o;
        }
        // Opzione B: morph target jawOpen
        if (o.isMesh && o.morphTargetDictionary) {
          const idx = o.morphTargetDictionary['jawOpen'] ?? o.morphTargetDictionary['JawOpen'];
          if (idx !== undefined) {
            anim.morphMesh    = o;
            anim.morphJawIdx  = idx;
          }
        }
      });
      const lipSyncMethod = anim.bones.jaw ? 'jaw bone' : anim.morphMesh ? 'morph target jawOpen' : 'head rotation (fallback)';
      console.log('Bone trovati:', Object.keys(anim.bones), '| Lip sync:', lipSyncMethod);
      setTimeout(initScrubber, 100);

      if (gltf.animations?.length) {
        state.mixer     = new THREE.AnimationMixer(model);
        state._fullClip = gltf.animations[0];

        // Una sola azione sul clip completo — il range è controllato nel render loop
        state.mainAction = state.mixer.clipAction(state._fullClip);
        state.mainAction.setLoop(THREE.LoopRepeat, Infinity);
        state.mainAction.timeScale = 1;
        state.mainAction.time = ANIM_RANGE.idleStart;
        state.mainAction.play();

        // Comunica la durata del clip all'admin (se in preview)
        if (IS_PREVIEW) {
          window.parent.postMessage({ type: 'clipDuration', duration: state._fullClip.duration }, '*');
        }
      }

      startRenderLoop();
      console.log('✅ Modello GLB caricato:', url);
    },
    xhr => {
      const el = document.querySelector('#avatar-loader .loader-text');
      if (!el) return;
      const total = xhr.total || _glbTotal;
      if (total) {
        el.textContent = `Caricamento avatar… ${Math.round(xhr.loaded / total * 100)}%`;
      } else if (xhr.loaded > 0) {
        el.textContent = `Caricamento avatar… ${(xhr.loaded / 1048576).toFixed(1)} MB`;
      }
    },
    err => {
      document.getElementById('avatar-loader').classList.add('hidden');
      console.warn('⚠️ Modello GLB non caricato, uso placeholder:', err);
      createPlaceholderAvatar();
    }
  );
}

const AVATAR_ID   = location.pathname.split('/').pop();
const IS_PREVIEW  = location.pathname.startsWith('/preview/');

// Nasconde il pannello impostazioni sempre (i controlli sono nel backoffice)
const sp = document.getElementById('settings-panel');
if (sp) sp.style.display = 'none';

// ── postMessage: aggiornamenti real-time dall'admin ───────────────────────────

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg) return;

  if (msg.type === 'previewResize') {
    updateMicBtn(msg.width);
    updateAudioBtn(msg.width);
    updatePttBtn(msg.width);
    return;
  }



  if (msg.type === 'idleParam') {
    applyIdleParam(msg.key, msg.value);
    return;
  }

  if (msg.type === 'avatarParam') {
    if (msg.key === 'overlay_color' || msg.key === 'overlay_opacity' || msg.key === 'overlay_height') {
      if (msg.key === 'overlay_color')   CONFIG._overlayColor   = msg.value;
      if (msg.key === 'overlay_opacity') CONFIG._overlayOpacity = parseFloat(msg.value);
      if (msg.key === 'overlay_height') {
        CONFIG._overlayHeight = parseFloat(msg.value);
        document.documentElement.style.setProperty('--overlay-height', `${CONFIG._overlayHeight}vh`);
      }
      applyOverlay(CONFIG._overlayColor || '#0a0a0f', CONFIG._overlayOpacity ?? 0.75);
      return;
    }
    if (msg.key === 'wake_word_enabled') {
      const wasEnabled = CONFIG.wakeWordEnabled;
      CONFIG.wakeWordEnabled = !!parseInt(msg.value);
      if (CONFIG.wakeWordEnabled) {
        // Attiva: avvia Web Speech per rilevare wake word
        if (!wasEnabled) startWakeWord();
      } else {
        // Disattiva: ferma Web Speech
        stopWakeWord();
        if (!CONFIG.wakeWordAlwaysRequired && CONFIG.micEnabled) {
          if (!state.vad) {
            _startVad();
          } else if (state.mode === 'idle') {
            // VAD già attivo ma in idle: lo fermo e riavvio così il suo onSpeechStart
            // può ora entrare in free-talk senza aspettare la wake word
            const old = state.vad;
            state.vad = null;
            old.stop();
            _startVad();
          } else {
            // Sessione attiva: sblocca subito la registrazione
            state.vad.recordingEnabled = true;
            state.wakeActivated = false;
          }
        }
      }
      return;
    }
    if (msg.key === 'wake_word_always') {
      CONFIG.wakeWordAlwaysRequired = !!parseInt(msg.value);
      if (CONFIG.wakeWordAlwaysRequired) {
        // Attiva: disabilita VAD recording finché non scatta wake word, avvia Web Speech
        if (state.vad) state.vad.recordingEnabled = false;
        state.wakeActivated = false;
        if (state.mode !== 'idle') startWakeWord();
      } else {
        // Disattiva: torna a free-talk, abilita VAD recording subito
        stopWakeWord();
        // Se in sessione attiva, sblocca subito l'ascolto
        state.wakeActivated = ACTIVE_MODES.has(state.mode);
        if (state.vad) state.vad.recordingEnabled = true;
        else if (CONFIG.micEnabled) _startVad();
      }
      return;
    }
    if (msg.key === 'idle_disabled') {
      CONFIG.idleDisabled = !!parseInt(msg.value);
      if (CONFIG.idleDisabled) {
        clearTimeout(_idleTimer);
        document.getElementById('idle-overlay').classList.add('hidden');
        setControlsVisible(true);
      } else {
        document.getElementById('idle-overlay').classList.remove('hidden');
        setControlsVisible(false);
      }
      return;
    }
    if (msg.key === 'bg_video') {
      const bgVid = document.getElementById('avatar-bg-video');
      if (msg.value) {
        bgVid.src = `/${msg.value}`; bgVid.style.display = 'block';
        document.getElementById('avatar-panel').style.background = 'transparent';
      } else {
        bgVid.src = ''; bgVid.style.display = 'none';
        document.getElementById('avatar-panel').style.background = '';
      }
    } else if (msg.key === 'background') {
      const color = msg.value;
      document.body.style.background = color;
      document.getElementById('avatar-panel').style.background =
        `radial-gradient(ellipse at 50% 60%, ${color}aa 0%, ${color} 70%)`;
    } else {
      const stringKeys = ['chat_align', 'model_file', 'mic_icon', 'mic_icon_disabled', 'audio_icon', 'audio_icon_disabled', 'chat_font', 'mic_wave_color', 'audio_wave_color', 'idle_font', 'idle_icon_img', 'theme', 'mic_bg_color', 'mic_disabled_color', 'mic_border_color', 'mic_border_disabled_color', 'audio_bg_color', 'audio_disabled_color', 'audio_border_color', 'audio_border_disabled_color', 'greeting_text', 'stt_prompt', 'wake_words', 'mic_bubble_text', 'mic_bubble_bg_color', 'mic_bubble_border_color', 'mic_bubble_font', 'mic_bubble_bg_image', 'ptt_bg_color', 'ptt_border_color', 'ptt_icon'];
      const val = stringKeys.includes(msg.key) ? msg.value : parseFloat(msg.value);
      applyParamLive(msg.key, val);
    }
  }

  if (msg.type === 'playRange') {
    // Loop forzato in un range specifico per anteprima
    state._previewRange = msg.range === 'idle'
      ? { start: ANIM_RANGE.idleStart,   end: ANIM_RANGE.idleEnd }
      : { start: ANIM_RANGE.speechStart, end: ANIM_RANGE.speechEnd };
    if (state.mainAction) {
      state.mainAction.time = state._previewRange.start;
      state.mainAction.timeScale = 1;
    }
    state._isPreviewLooping = true;
  }

  if (msg.type === 'stopRange') {
    state._isPreviewLooping = false;
    state._previewRange     = null;
    state._adminScrubbing   = false;
    if (state.mainAction) state.mainAction.paused = false;
  }

  if (msg.type === 'playFrom') {
    const start = parseFloat(msg.time);
    const end   = msg.end != null ? parseFloat(msg.end) : null;
    state._adminScrubbing = false;
    if (state.mainAction) {
      state.mainAction.paused    = false;
      state.mainAction.time      = start;
      state.mainAction.timeScale = 1;
    }
    state._previewRange     = end !== null ? { start, end } : null;
    state._isPreviewLooping = end !== null;
  }

  if (msg.type === 'scrubTo') {
    if (state.mainAction && state.mixer) {
      state._isPreviewLooping = false;
      state._previewRange     = null;
      state._adminScrubbing   = true;
      state.mainAction.paused = true;
      state.mainAction.time   = parseFloat(msg.time);
      state.mixer.update(0);
    }
  }

  if (msg.type === 'resumePlay') {
    if (state.mainAction) state.mainAction.paused = false;
  }
});

function applyTheme(theme) {
  const valid = ['viola','rosso','arancio','verde','giallo','blu'];
  document.documentElement.setAttribute('data-theme', valid.includes(theme) ? theme : 'viola');
}


const IDLE_ID_MAP = { idle_icon: 'idle-icon-emoji', idle_title: 'idle-title', idle_subtitle: 'idle-subtitle', idle_hint: 'idle-hint' };
function applyIdleParam(key, value) {
  if (key === 'idle_timeout') {
    CONFIG.idleTimeout = parseInt(value) * 1000;
    resetIdleTimer();
    return;
  }
  if (key === 'idle_icon_img') {
    const img   = document.getElementById('idle-icon-img');
    const emoji = document.getElementById('idle-icon-emoji');
    if (!img) return;
    if (value) {
      img.src = `/${value}?t=${Date.now()}`;
      img.style.display = 'block';
      if (emoji) emoji.style.display = 'none';
    } else {
      img.style.display = 'none';
      if (emoji) emoji.style.display = '';
    }
    return;
  }
  if (key === 'idle_video') {
    const vid = document.getElementById('idle-overlay-video');
    const overlay = document.getElementById('idle-overlay');
    if (!vid) return;
    if (value) {
      vid.src = `/${value}`;
      vid.style.display = 'block';
    } else {
      vid.src = '';
      vid.style.display = 'none';
    }
    return;
  }
  if (key === 'idle_bg_image') {
    const overlay = document.getElementById('idle-overlay');
    if (!overlay) return;
    overlay.style.backgroundImage = value ? `url(/${value})` : '';
    return;
  }
  if (key === 'idle_bg_color' || key === 'idle_bg_color_alpha') {
    if (key === 'idle_bg_color_alpha') CONFIG._idleBgColorAlpha = parseFloat(value) ?? 1;
    if (key === 'idle_bg_color')       CONFIG._idleBgColor      = value || '';
    const overlay = document.getElementById('idle-overlay');
    if (!overlay) return;
    const col   = CONFIG._idleBgColor || '';
    const alpha = CONFIG._idleBgColorAlpha ?? 1;
    if (col) {
      const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
      overlay.style.backgroundColor = `rgba(${r},${g},${b},${alpha})`;
    } else {
      overlay.style.backgroundColor = '';
    }
    return;
  }
  if (key === 'idle_bg_opacity') {
    const overlay = document.getElementById('idle-overlay');
    if (!overlay) return;
    overlay.style.setProperty('--idle-bg-opacity', value != null ? parseFloat(value) : 1);
    return;
  }
  if (key === 'idle_font') {
    const overlay = document.getElementById('idle-overlay');
    if (!overlay) return;
    if (value) {
      const link = document.getElementById('_idle-font-link') || document.createElement('link');
      link.id = '_idle-font-link'; link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(value).replace(/%20/g,'+')}&display=swap`;
      document.head.appendChild(link);
      overlay.style.setProperty('--idle-font-family', `'${value}', sans-serif`);
    } else {
      overlay.style.setProperty('--idle-font-family', 'inherit');
    }
    return;
  }
  if (key === 'idle_font_size') {
    document.getElementById('idle-overlay')?.style.setProperty('--idle-font-size', parseFloat(value) + 'rem');
    return;
  }
  const el = document.getElementById(IDLE_ID_MAP[key]);
  if (el) el.textContent = value;
}

// ── WebSocket: aggiornamenti config dal server ────────────────────────────────
(function connectConfigWS() {
  if (IS_PREVIEW) return; // il preview usa già postMessage
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'say' && msg.avatarId === AVATAR_ID && msg.text) {
        handleSayMessage(msg.text);
        return;
      }
      if (msg.type === 'config_update' && msg.avatarId === AVATAR_ID) {
        const d = msg.data;
        if (d.chat_bottom     !== undefined) applyParamLive('chat_bottom',     d.chat_bottom);

        if (d.idle_timeout   !== undefined) applyIdleParam('idle_timeout',  d.idle_timeout);

        if (d.idle_bg_opacity !== undefined) applyIdleParam('idle_bg_opacity', d.idle_bg_opacity);
        if (d.idle_font       !== undefined) applyIdleParam('idle_font',       d.idle_font);
        if (d.idle_font_size  !== undefined) applyIdleParam('idle_font_size',  d.idle_font_size);
        if (d.vad_threshold           !== undefined) applyParamLive('vad_threshold',           d.vad_threshold);
        if (d.vad_silence_duration    !== undefined) applyParamLive('vad_silence_duration',    d.vad_silence_duration);
        if (d.vad_min_speech_duration !== undefined) applyParamLive('vad_min_speech_duration', d.vad_min_speech_duration);
        if (d.vad_min_blob_size       !== undefined) applyParamLive('vad_min_blob_size',       d.vad_min_blob_size);
        if (d.vad_wake_timeout        !== undefined) applyParamLive('vad_wake_timeout',        d.vad_wake_timeout);
        if (d.vad_noise_mult          !== undefined) applyParamLive('vad_noise_mult',          d.vad_noise_mult);
        if (d.stt_prompt              !== undefined) applyParamLive('stt_prompt',              d.stt_prompt);
        if (d.greeting_text           !== undefined) applyParamLive('greeting_text',           d.greeting_text);
        if (d.wake_words              !== undefined) applyParamLive('wake_words',              d.wake_words);
        if (d.wake_word_enabled !== undefined) {
          const was = CONFIG.wakeWordEnabled;
          CONFIG.wakeWordEnabled = !!d.wake_word_enabled;
          if (CONFIG.wakeWordEnabled && !was) startWakeWord();
          else if (!CONFIG.wakeWordEnabled && was) stopWakeWord();
        }
        if (d.wake_word_always !== undefined) {
          CONFIG.wakeWordAlwaysRequired = !!d.wake_word_always;
        }
      }
    } catch {}
  };
  ws.onclose = () => setTimeout(connectConfigWS, 3000);
})();

function applyOverlay(color, opacity) {
  const el = document.getElementById('chat-overlay-layer');
  if (!el) return;
  const r = parseInt(color.slice(1,3), 16) ?? 10;
  const g = parseInt(color.slice(3,5), 16) ?? 10;
  const b = parseInt(color.slice(5,7), 16) ?? 15;
  // La sfumatura inizia tenendo conto anche del bottom offset del pannello
  const h         = CONFIG._overlayHeight ?? 65;
  const bottomPx  = CONFIG._chatBottom    ?? 0;
  const bottomPct = (bottomPx / window.innerHeight) * 100;
  const start = Math.max(0, 100 - h - bottomPct);     // bordo superiore reale
  const fade  = Math.min(start + 20, 100);             // sfumatura su 20% dell'altezza
  el.style.background = `linear-gradient(
    to bottom,
    rgba(${r},${g},${b},0) ${start}%,
    rgba(${r},${g},${b},${opacity}) ${fade}%,
    rgba(${r},${g},${b},${opacity}) 100%
  )`;
}

function applyParamLive(key, v) {
  const map = {
    avatar_scale:    () => { if (!state.avatar) return; const b=new THREE.Box3().setFromObject(state.avatar); const s=b.getSize(new THREE.Vector3()); const vis=2*Math.tan((45/2)*Math.PI/180)*camera.position.z; state.avatar.scale.setScalar((vis*v)/s.y*state.avatar.scale.x); anim.baseY=state.avatar.position.y; },
    avatar_offset_x: () => { if (!state.avatar) return; state.avatar.position.x = v; },
    avatar_offset_y: () => { if (!state.avatar) return; state.avatar.position.y = v; anim.baseY = v; },
    avatar_rot_y:    () => { if (!state.avatar) return; state.avatar.rotation.y = v; },
    camera_z:        () => { if (!state.avatar) return; camera.position.z = v; camera.lookAt(0, CONFIG.cameraLookAtY, 0); },
    camera_y:        () => { if (!state.avatar) return; camera.position.y = v; camera.lookAt(0, CONFIG.cameraLookAtY, 0); },
    camera_look_at_y:() => { if (!state.avatar) return; CONFIG.cameraLookAtY = v; camera.lookAt(0, v, 0); },
    anim_pingpong: () => { CONFIG.animPingPong = !!v; if (state.mainAction) state.mainAction.timeScale = 1; },
    idle_start:   () => { ANIM_RANGE.idleStart   = v; if (state._isPreviewLooping && state._previewRange?.start !== undefined && ANIM_RANGE.idleStart <= ANIM_RANGE.idleEnd) state._previewRange = { start: ANIM_RANGE.idleStart, end: ANIM_RANGE.idleEnd }; },
    idle_end:     () => { ANIM_RANGE.idleEnd     = v; if (state._isPreviewLooping && state._previewRange?.end   !== undefined && ANIM_RANGE.idleStart <= ANIM_RANGE.idleEnd) state._previewRange = { start: ANIM_RANGE.idleStart, end: ANIM_RANGE.idleEnd }; },
    speech_start: () => { ANIM_RANGE.speechStart = v; if (state._isPreviewLooping && state._previewRange?.start !== undefined && ANIM_RANGE.speechStart <= ANIM_RANGE.speechEnd) state._previewRange = { start: ANIM_RANGE.speechStart, end: ANIM_RANGE.speechEnd }; },
    speech_end:   () => { ANIM_RANGE.speechEnd   = v; if (state._isPreviewLooping && state._previewRange?.end   !== undefined && ANIM_RANGE.speechStart <= ANIM_RANGE.speechEnd) state._previewRange = { start: ANIM_RANGE.speechStart, end: ANIM_RANGE.speechEnd }; },
    chat_bottom:     () => {
      CONFIG._chatBottom = parseFloat(v);
      if (window.innerWidth > 600)
        document.documentElement.style.setProperty('--chat-bottom', `${parseFloat(v)}px`);
      applyOverlay(CONFIG._overlayColor || '#0a0a0f', CONFIG._overlayOpacity ?? 0.75);
    },
    chat_max_width:  () => { document.documentElement.style.setProperty('--chat-max-width', `${v}%`); },
    chat_align:      () => {
      const p = document.getElementById('interaction-panel');
      p.classList.remove('align-left','align-center','align-right');
      p.classList.add(`align-${v}`);
    },
    chat_hide_input: () => {
      document.getElementById('input-area').classList.toggle('hidden', parseInt(v) === 1);
    },
    chat_font:      () => {
      const el = document.getElementById('interaction-panel');
      if (!el) return;
      if (v) {
        const link = document.getElementById('_chat-font-link') || document.createElement('link');
        link.id = '_chat-font-link'; link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(v).replace(/%20/g,'+')}&display=swap`;
        document.head.appendChild(link);
        el.style.setProperty('--chat-font-family', `'${v}', sans-serif`);
      } else {
        el.style.setProperty('--chat-font-family', 'inherit');
      }
    },
    chat_font_size: () => {
      CONFIG.chatFontSize = parseFloat(v);
      const size = window.innerWidth <= 600 ? '1rem' : (v + 'rem');
      document.getElementById('interaction-panel')?.style.setProperty('--chat-font-size', size);
    },
    greeting_text:           () => { CONFIG.greetingText = v || ''; },
    wake_words:              () => {
      CONFIG.wakeWords = v || '';
      if (state.wakeRecognition) {
        clearTimeout(CONFIG._wakeWordsRestartTimer);
        CONFIG._wakeWordsRestartTimer = setTimeout(() => { stopWakeWord(); startWakeWord(); }, 300);
      }
    },
    vad_threshold:           () => { CONFIG.vadThreshold = v; if (state.vad) state.vad.threshold = v; },
    vad_silence_duration:    () => { CONFIG.vadSilenceDuration = v; if (state.vad) state.vad.silenceDuration = v; },
    vad_min_speech_duration: () => { CONFIG.vadMinSpeechDuration = v; if (state.vad) state.vad.minSpeechDuration = v; },
    vad_min_blob_size:       () => { CONFIG.vadMinBlobSize = v; },

    model_file:   () => {

    mic_visible:                 () => { CONFIG.micVisible              = v !== 0 && v !== false; updateMicBtn(); _repositionMobileButtonsAuto(); },
    mic_bubble_visible:          () => { CONFIG.micBubbleVisible  = v !== 0 && v !== false; updateMicBubble(); },
    mic_bubble_text:             () => { CONFIG.micBubbleText     = v; updateMicBubble(); },
    mic_bubble_x:                () => { CONFIG.micBubbleX        = +v; updateMicBubble(); },
    mic_bubble_y:                () => { CONFIG.micBubbleY        = +v; updateMicBubble(); },
    mic_bubble_font:             () => { CONFIG.micBubbleFont         = v; updateMicBubble(); },

    mic_bubble_bg_color:         () => { CONFIG.micBubbleBgColor      = v; updateMicBubble(); },

    audio_visible:               () => { CONFIG.audioVisible            = v !== 0 && v !== false; updateMicBtn(); updateAudioBtn(); _repositionMobileButtonsAuto(); },
    audio_bg_color:              () => { CONFIG.audioBgColor            = v; updateAudioBtn(); },
    audio_disabled_color:        () => { CONFIG.audioDisabledColor      = v; updateAudioBtn(); },
    audio_border_color:          () => { CONFIG.audioBorderColor        = v; updateAudioBtn(); },

    theme:                () => applyTheme(v),

    ptt_enabled:    () => { if (!CONFIG._ready) return; CONFIG.pttEnabled = v !== 0 && v !== false; updateMicBtn(); updateAudioBtn(); updatePttBtn(); _repositionMobileButtonsAuto(); },
    ptt_icon:       () => { if (!CONFIG._ready) return; CONFIG.pttIcon       = v; CONFIG._iconTs = Date.now(); updatePttBtn(); },

    ptt_border_color: () => { if (!CONFIG._ready) return; CONFIG.pttBorderColor = v; updatePttBtn(); },
  };

  map[key]?.();
}

async function initAvatar() {
  try {
    const endpoint = IS_PREVIEW ? `/api/preview/${AVATAR_ID}` : `/api/avatar/${AVATAR_ID}`;
    const res  = await fetch(endpoint);
    const cfg  = await res.json();
    if (!res.ok) throw new Error(cfg.error);

    // Applica config
    CONFIG.avatarId      = AVATAR_ID;
    CONFIG.avatarName    = cfg.name;
    CONFIG.greetingText         = cfg.greeting_text           || '';
    CONFIG.vadThreshold         = cfg.vad_threshold           ?? 0.012;
    CONFIG.vadSilenceDuration   = cfg.vad_silence_duration    ?? 1300;
    CONFIG.vadMinSpeechDuration = cfg.vad_min_speech_duration ?? 150;
    CONFIG.vadMinBlobSize       = cfg.vad_min_blob_size       ?? 3000;
    CONFIG.vadWakeTimeout       = cfg.vad_wake_timeout        ?? 5000;
    CONFIG.vadNoiseMult         = cfg.vad_noise_mult          ?? 2.8;
    // Se non c'è un prompt custom, usa il nome avatar come hint minimo per Whisper
    CONFIG.sttPrompt            = cfg.stt_prompt || cfg.name || '';
    CONFIG.sttLanguage          = cfg.stt_language || 'it-IT';
    CONFIG.avatarModelUrl = cfg.model_file ? `/${cfg.model_file}` : null;
    CONFIG.micIcon         = cfg.mic_icon          || '';
    CONFIG.micIconDisabled = cfg.mic_icon_disabled || '';
    CONFIG.micIconSize   = cfg.mic_icon_size   ?? 44;
    CONFIG.micIconX      = cfg.mic_icon_x      ?? 0;
    CONFIG.micIconY      = cfg.mic_icon_y      ?? 0;
    CONFIG.audioIcon         = cfg.audio_icon          || '';
    CONFIG.audioIconDisabled = cfg.audio_icon_disabled || '';
    CONFIG.audioIconSize = cfg.audio_icon_size ?? 44;
    CONFIG.audioIconX      = cfg.audio_icon_x      ?? 0;
    CONFIG.audioIconY      = cfg.audio_icon_y      ?? 0;
    CONFIG.micWaveColor      = cfg.mic_wave_color      || '#ffffff';

    CONFIG.micBubbleX            = cfg.mic_bubble_x             ?? 0;
    CONFIG.micBubbleY            = cfg.mic_bubble_y             ?? -80;

    CONFIG.pttIconSize    = cfg.ptt_icon_size   ?? 80;
    CONFIG.pttIconX       = cfg.ptt_icon_x      ?? 0;
    CONFIG.pttIconY       = cfg.ptt_icon_y      ?? 0;
    CONFIG.pttBgColor     = cfg.ptt_bg_color     || 'rgba(248,113,113,0.15)';

    CONFIG.idleTimeout = (cfg.idle_timeout ?? 90) * 1000;
    CONFIG.idleDisabled = !!(cfg.idle_disabled);
    CONFIG.wakeWordEnabled = !!(cfg.wake_word_enabled);
    CONFIG.wakeWordAlwaysRequired = !!(cfg.wake_word_always);
    CONFIG.wakeWords = cfg.wake_words || '';
    if (CONFIG.pttEnabled) {
      // PTT: avvia wakeword se abilitata; idle overlay e controlli seguono il flusso normale
      if (CONFIG.wakeWordEnabled || CONFIG.wakeWordAlwaysRequired)
        setTimeout(() => { if (state.mode === 'idle' || state.mode === 'listening') startWakeWord(); }, 500);
    } else if (CONFIG.idleDisabled) {
      // Casi 1,2,3: mostra chat subito, avvia sessione al primo gesto o dopo 600ms
      document.getElementById('idle-overlay').classList.add('hidden');
      setControlsVisible(true);
      let _wakeUpDone = false;
      const _doWakeUp = () => { if (!_wakeUpDone) { _wakeUpDone = true; wakeUp(); } };
      setTimeout(_doWakeUp, 600);
      document.addEventListener('click', _doWakeUp, { once: true });
    } else if (CONFIG.wakeWordEnabled) {
      // Casi 4,5: avvia subito la recognition in idle così la wake word funziona senza toccare
      setTimeout(() => { if (state.mode === 'idle') startWakeWord(); }, 500);
    }
    // Caso 6: nessuna recognition, solo click su overlay → wakeUp()

    // Aggiorna pulsanti con la config caricata
    updateMicBtn();
    updateAudioBtn();
    updatePttBtn();

    // Aggiorna camera
    camera.position.set(0, CONFIG.cameraY, CONFIG.cameraZ);
    camera.lookAt(0, CONFIG.cameraLookAtY, 0);

    // Carica modello
    if (CONFIG.avatarModelUrl) {
      loadGLBAvatar(CONFIG.avatarModelUrl + '?t=' + Date.now());
    } else {
      createPlaceholderAvatar();
    }

  } catch (err) {
    console.error('Errore caricamento avatar:', err);
    createPlaceholderAvatar();
  }
}

// Avvia caricamento senza bloccare il rendering iniziale
requestAnimationFrame(() => initAvatar());
</script>
</body>
</html>
