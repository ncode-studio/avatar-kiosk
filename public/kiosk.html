<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preload" href="/lib/three.min.js" as="script"/>
  <link rel="preload" href="/lib/GLTFLoader.js" as="script"/>
  <link rel="preload" href="/lib/draco/draco_decoder.wasm" as="fetch" crossorigin/>
  <title>Avatar Kiosk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #13131a;
      --surface2:  #1e1e2a;
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --text:      #f0f0f5;
      --text-dim:  #8888aa;
      --success:   #22d3a0;
      --error:     #f87171;
      --warn:      #fbbf24;
      --border:    rgba(108,99,255,0.25);
    }

    /* ── Temi ─────────────────────────────────────── */
    :root[data-theme="rosso"]   { --accent:#e05252; --accent2:#f87171; --border:rgba(224,82,82,0.25); }
    :root[data-theme="arancio"] { --accent:#e07832; --accent2:#fb923c; --border:rgba(224,120,50,0.25); }
    :root[data-theme="verde"]   { --accent:#22c55e; --accent2:#4ade80; --border:rgba(34,197,94,0.25); }
    :root[data-theme="giallo"]  { --accent:#d4a017; --accent2:#fbbf24; --border:rgba(212,160,23,0.25); }
    :root[data-theme="blu"]     { --accent:#3b82f6; --accent2:#93c5fd; --border:rgba(59,130,246,0.25); }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }

    /* ─── Layout principale ─────────────────────────── */
    #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ─── Header ────────────────────────────────────── */
    #header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      z-index: 10; pointer-events: none;
    }

    /* ─── Avatar Panel ──────────────────────────────── */
    #avatar-panel { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, #1a1030 0%, var(--bg) 70%); }

    /* ─── Loading spinner ───────────────────────── */
    #avatar-loader {
      position: absolute; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); transition: opacity .5s;
    }
    #avatar-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: .8rem; color: var(--text-dim); }

    #avatar-canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* Ring "sta parlando" */
    #avatar-ring {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #avatar-ring.speaking {
      opacity: 1;
      animation: ring-pulse 1.2s ease-in-out infinite;
    }


    /* ─── Overlay chat ──────────────────────────────── */
    #chat-overlay-layer {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 20;
      background: linear-gradient(
        to bottom,
        rgba(10,10,15,0) 0%,
        rgba(10,10,15,0.3) 35%,
        rgba(10,10,15,0.75) 65%
      );
    }

    /* ─── Pannello interazione ──────────────────────── */
    #interaction-panel {
      position: absolute; bottom: var(--chat-bottom, 0px);
      height: var(--overlay-height, 65vh);
      width: var(--chat-max-width, 100%);
      z-index: 60; display: flex; flex-direction: column;
      touch-action: pan-y;
      overflow: hidden;
      /* posizione orizzontale: sovrascritta da JS via --chat-align */
      left: 50%; right: auto; transform: translateX(-50%);
    }
    #interaction-panel.align-left   { left: 0;    right: auto; transform: none; }
    #interaction-panel.align-center { left: 50%;  right: auto; transform: translateX(-50%); }
    #interaction-panel.align-right  { left: auto; right: 0;    transform: none; }
    #input-area.hidden { display: none !important; }

    /* ─── Area risposta ─────────────────────────────── */
    #response-area {
      flex: 1 1 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 50%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 50%);
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 20px 24px 12px;
      display: flex; flex-direction: column;
      position: relative; z-index: 22;
      scroll-behavior: smooth;
    }

    #interaction-panel {
      --chat-font-family: inherit;
      --chat-font-size: 1rem;
    }

    #chat-history {
      margin-top: auto;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transcript-bubble, .response-bubble-hist {
      font-family: var(--chat-font-family);
    }

    #response-area::-webkit-scrollbar { width: 4px; }
    #response-area::-webkit-scrollbar-track { background: transparent; }
    #response-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #response-area::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Indicatore "nuovo messaggio" */
    #scroll-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      padding: 4px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: none;
      z-index: 23;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(108,99,255,0.5);
    }

    /* Bolle nella cronologia (permanenti) */
    .transcript-bubble {
      align-self: flex-end;
      max-width: 90%;
      background: var(--accent);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 12px 16px;
      font-size: var(--chat-font-size);
      line-height: 1.5;
    }

    .response-bubble-hist {
      align-self: flex-start;
      max-width: 95%;
      background: rgba(30,30,42,0.6);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 18px;
      font-size: var(--chat-font-size);
      line-height: 1.6;
      backdrop-filter: blur(8px);
    }

    .response-bubble-hist .label {
      font-size: calc(var(--chat-font-size) * 0.6);
      font-weight: 700;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent2);
      display: block;
      margin-bottom: 6px;
    }

    /* Markdown renderizzato nelle bolle avatar */
    .bubble-content p  { margin: 0 0 6px; }
    .bubble-content p:last-child { margin-bottom: 0; }
    .bubble-content strong { color: var(--accent2); }
    .bubble-content ul, .bubble-content ol { margin: 4px 0 4px 18px; }
    .bubble-content li { margin-bottom: 2px; }
    .bubble-content code {
      background: rgba(108,99,255,0.15);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.9em;
    }

    /* Bubble singola corrente (legacy, usata durante la digitazione) */
    #transcript-bubble {
      align-self: flex-end;
      max-width: 90%;
      background: var(--accent);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 14px 18px;
      font-size: var(--chat-font-size);
      font-family: var(--chat-font-family);
      line-height: 1.5;
      display: none;
    }

    #transcript-bubble .label {
      font-size: calc(var(--chat-font-size) * 0.6);
      font-weight: 700;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 6px;
    }

    #response-bubble {
      align-self: flex-start;
      max-width: 95%;
      background: rgba(30,30,42,0.6);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 18px 20px;
      font-size: var(--chat-font-size);
      font-family: var(--chat-font-family);
      line-height: 1.6;
      display: none;
      backdrop-filter: blur(8px);
    }

    #response-bubble .label {
      font-size: calc(var(--chat-font-size) * 0.6);
      font-weight: 700;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent2);
      display: block;
      margin-bottom: 8px;
    }

    .typing-indicator {
      align-self: flex-start;
      display: none;
      margin-top: 14px;
      gap: calc(var(--chat-font-size) * 0.35);
      padding: calc(var(--chat-font-size) * 0.75) calc(var(--chat-font-size) * 1.4);
      background: rgba(30,30,42,0.6);
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      font-family: var(--chat-font-family);
    }
    .typing-indicator.visible { display: flex; align-items: center; }
    .typing-indicator span {
      width: calc(var(--chat-font-size) * 0.38);
      height: calc(var(--chat-font-size) * 0.38);
      background: var(--accent2);
      border-radius: 50%;
      animation: typing 1.2s infinite;
      flex-shrink: 0;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    /* ─── Input testuale (fallback) ─────────────────── */
    #input-area { padding: 10px 20px 24px; padding-bottom: max(24px, env(safe-area-inset-bottom, 24px)); display: flex; gap: 10px; position: relative; z-index: 22; }

    #text-input {
      flex: 1;
      background: rgba(30,30,42,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--text);
      font-size: var(--chat-font-size, 1rem);
      outline: none;
      font-family: var(--chat-font-family, inherit);
      transition: border-color 0.2s;
      min-width: 0;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--text-dim); }

    /* ─── Fumetto mic ────────────────────────────────── */
    #mic-bubble {
      position: fixed;
      color: #1a1a2e;
      font-weight: 500;
      line-height: 1.35;
      padding: 8px 12px;
      max-width: 190px;
      white-space: normal;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      pointer-events: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 101;
      display: none;
      transition: opacity 0.3s;
    }
    body.idle-hidden #mic-bubble { opacity: 0; }
    @keyframes bubble-bounce {
      0%,100% { transform: translateY(0) scale(1); }
      15%      { transform: translateY(-14px) scale(1.07); }
      30%      { transform: translateY(0) scale(1); }
      45%      { transform: translateY(-8px) scale(1.04); }
      60%      { transform: translateY(0) scale(1); }
      75%      { transform: translateY(-4px) scale(1.02); }
      90%      { transform: translateY(0) scale(1); }
    }
    #mic-bubble.bouncing { animation: bubble-bounce 1.4s ease-in-out; }

    /* ─── Forme d'onda nei bottoni mic/audio ─────────── */
    .btn-wave {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 6px;
      box-sizing: border-box;
      pointer-events: none;
      border-radius: 50%;
      overflow: hidden;
      background: transparent;
    }
    .btn-wave-bar {
      flex: 1;
      max-width: 5px;
      border-radius: 3px;
      background: var(--wave-color, #fff);
      height: 4px;
      transition: height 0.07s ease;
    }
    @keyframes wave-bar {
      0%, 100% { height: 4px; }
      50%       { height: 28px; }
    }
    .audio-wave .btn-wave-bar,
    .mic-wave-anim .btn-wave-bar {
      animation: wave-bar 0.7s ease-in-out infinite;
    }
    .audio-wave .btn-wave-bar:nth-child(2),
    .mic-wave-anim .btn-wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .audio-wave .btn-wave-bar:nth-child(3),
    .mic-wave-anim .btn-wave-bar:nth-child(3) { animation-delay: 0.3s;  }
    .audio-wave .btn-wave-bar:nth-child(4),
    .mic-wave-anim .btn-wave-bar:nth-child(4) { animation-delay: 0.15s; }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 14px;
      width: 52px;
      align-self: stretch;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
      flex-shrink: 0;
    }
    #send-btn:hover  { background: var(--accent2); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.96); }
    #send-btn svg    { fill: white; width: 20px; height: 20px; }

    /* ─── Idle Overlay ──────────────────────────────── */
    body.idle-hidden #mic-btn,
    body.idle-hidden #audio-btn,
    body.idle-hidden #ptt-btn,
    body.idle-hidden #interaction-panel {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #idle-overlay-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }
    #idle-overlay > *:not(#idle-overlay-video) { position: relative; z-index: 2; }
    #idle-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.5s;
      --idle-font-family: inherit;
      --idle-font-size: 1rem;
      --idle-bg-opacity: 1;
      font-family: var(--idle-font-family);
    }
    #idle-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10,10,15,1);
      background-color: inherit;
      background-image: inherit;
      background-size: cover;
      background-position: center;
      opacity: var(--idle-bg-opacity);
      transition: opacity 0.5s;
      z-index: 0;
    }
    #idle-overlay.hidden { opacity: 0; pointer-events: none; }

    .idle-avatar-icon {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, #3b0764 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      margin: 24px 0 28px;
      box-shadow: 0 0 60px rgba(108,99,255,0.5);
      animation: float 3s ease-in-out infinite;
      overflow: hidden;
    }
    .idle-avatar-icon img {
      width: 70%; height: 70%;
      object-fit: contain;
      border-radius: 0;
      display: none;
    }

    #idle-overlay h2 {
      font-size: calc(var(--idle-font-size) * 2);
      font-weight: 700;
      margin-bottom: 10px;
      font-family: var(--idle-font-family);
    }
    #idle-overlay h2:empty { display: none; }

    #idle-overlay p {
      font-size: calc(var(--idle-font-size) * 1.1);
      color: var(--text-dim);
      font-family: var(--idle-font-family);
    }
    #idle-overlay p:empty { display: none; }

    .tap-hint:empty { display: none; }
    .tap-hint {
      margin-top: 36px;
      font-size: calc(var(--idle-font-size) * 0.95);
      font-family: var(--idle-font-family);
      color: var(--accent2);
      border: 1px solid var(--border);
      padding: 12px 28px;
      border-radius: 24px;
      animation: float 2s ease-in-out infinite;
    }

    /* ─── Animazioni ────────────────────────────────── */
    @keyframes ring-pulse {
      0%, 100% { transform: translateX(-50%) scale(1);    opacity: 1; }
      50%       { transform: translateX(-50%) scale(1.08); opacity: 0.6; }
    }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ─── Pannello impostazioni ─────────────────────── */
    #settings-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 30;
    }

    #settings-toggle {
      width: 38px; height: 38px;
      background: rgba(13,13,20,0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      margin-left: auto;
      transition: background 0.2s;
    }
    #settings-toggle:hover { background: var(--surface2); }

    #settings-body {
      display: none;
      margin-top: 8px;
      background: rgba(13,13,20,0.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      width: 230px;
      backdrop-filter: blur(10px);
    }
    #settings-body.open { display: block; }

    .settings-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    .slider-group {
      margin-bottom: 10px;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .slider-group label span {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: right;
    }

    .slider-group input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .copy-btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: var(--accent); }

    /* ─── FBX Dropzone ──────────────────────────────── */
    #fbx-dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-top: 6px;
    }
    #fbx-dropzone:hover, #fbx-dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,0.08);
      color: var(--text);
    }
    #fbx-status {
      font-size: 0.75rem;
      margin-top: 6px;
      min-height: 18px;
      text-align: center;
      color: var(--text-dim);
    }
    #fbx-status.ok    { color: var(--success); }
    #fbx-status.error { color: var(--error); }
    #fbx-status.loading { color: var(--accent2); }

    /* ─── Layout responsive bottoni mic/audio ──────── */
    @media (max-width: 600px) {
      .idle-avatar-icon {
        width: 90px !important;
        height: 90px !important;
        font-size: 2.2rem !important;
        margin: 20px 0 16px !important;
      }
      #idle-overlay h2 {
        font-size: 1.3rem !important;
        margin-bottom: 6px !important;
      }
      #idle-overlay p {
        font-size: 1rem !important;
        margin-bottom: 6px !important;
      }
      .tap-hint {
        font-size: 0.85rem !important;
      }
      #mic-btn {
        top: auto !important;
        bottom: max(var(--btn-mobile-bottom, 20px), env(safe-area-inset-bottom, 4px)) !important;
        right: auto !important;
        left: calc(50% - var(--btn-half-total-w, 34px)) !important;
      }
      #audio-btn {
        top: auto !important;
        bottom: max(var(--btn-mobile-bottom, 20px), env(safe-area-inset-bottom, 4px)) !important;
        right: auto !important;
        left: var(--audio-mobile-left) !important;
      }
      #input-area input {
        font-size: 16px !important;
      }
      #interaction-panel {
        bottom: var(--mobile-panel-bottom, 80px) !important;
      }
      #ptt-btn {
        bottom: max(var(--btn-mobile-bottom, 20px), env(safe-area-inset-bottom, 4px)) !important;
        left: var(--ptt-mobile-left) !important;
        transform: none !important;
        top: auto !important;
        right: auto !important;
      }
      #ptt-btn.ptt-pressing {
        transform: translateX(-50%) scale(0.92) !important;
      }
    }
  </style>
</head>
<body class="idle-hidden">
<div id="app">

  <!-- Header -->
  <div id="header"></div>
  <div id="controls-section">
    <div id="mic-bubble"></div>
    <button id="mic-btn" onclick="toggleMic()" title="Attiva/disattiva microfono"
      style="position:absolute;top:1.67vh;right:2.96vw;background:rgba(248,113,113,.15);border:2px solid rgba(248,113,113,.4);
             border-radius:50%;width:44px;height:44px;padding:0;display:flex;align-items:center;

// ═══════════════════════════════════════════════════════════════════════════
//  CONFIGURAZIONE
// ═══════════════════════════════════════════════════════════════════════════

const CONFIG = {
  serverUrl:    window.location.origin,
  idleTimeout:  90000,
  micEnabled:   true,
  audioEnabled: true,
  micIcon:      '',
  audioIcon:    '',
  _iconTs:      Date.now(),
  micIconSize:  44,
  micIconX:     0,
  micIconY:     0,
  micBubbleVisible:      true,
  micBubbleText:         '',
  micBubbleX:            0,
  micBubbleY:            -80,
  micBubbleFont:         '',
  micBubbleFontSize:     13,
  micBubbleBgColor:      'rgba(255,255,255,0.95)',
  micBubbleBorderColor:  'transparent',
  micBubbleBorderRadius: 12,
  micBubbleBgImage:      '',
  micBubbleWidth:        0,
  micBubbleHeight:       0,
  micBubbleBounce:       false,
  audioIconSize: 44,
  audioIconX:   0,
  audioIconY:   0,
  avatarName:   'Sofia',
  greetingText: '',
  wakeWordEnabled: false,
  wakeWordAlwaysRequired: false,
  wakeWords: '',
  avatarModelUrl: '/avatar.glb',

  // ── Posizione e scala avatar ──────────────────────
  avatarScale:    0.75,   // % dell'altezza del pannello (0.5 = metà, 1.0 = tutto)
  avatarOffsetX:  0.0,    // spostamento orizzontale in unità world
  avatarOffsetY:  0.0,    // spostamento verticale in unità world
  avatarOffsetZ:  0.0,    // spostamento profondità
  avatarRotY:     0.0,    // rotazione iniziale Y in radianti (es. 0.3 = girato a sinistra)

  // ── Camera ────────────────────────────────────────
  cameraZ:        3.5,    // distanza camera (più alto = più lontano)
  cameraY:        1.0,    // altezza camera
  cameraLookAtY:  1.0,    // punto di messa a fuoco verticale
  // VAD
  vadThreshold:        0.012,
  vadSilenceDuration:  1300,
  vadMinSpeechDuration: 150,
  vadMinBlobSize:      3000,
  vadWakeTimeout:      5000,
  vadNoiseMult:        2.8,
  sttPrompt:           '',
  // Push-To-Talk
  pttEnabled:   false,
  pttIcon:      '',
  pttIconSize:  80,
  pttIconX:     0,
  pttIconY:     0,
  pttBgColor:   'rgba(248,113,113,0.15)',
  pttBorderColor: 'rgba(248,113,113,0.5)',
};

// ═══════════════════════════════════════════════════════════════════════════
//  STATO
// ═══════════════════════════════════════════════════════════════════════════
const state = window._dbgState = {
  mode: 'idle',      // idle | listening | recording | thinking | speaking
  sessionId: null,
  kioskSessionId: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36)),
  currentAudio: null,
  unlockedAudio: null,
  mixer: null,
  avatar: null,
  vad: null,
  wakeRecognition: null,
  wakeActivated: false,
  bargeIn: false,
};

// ═══════════════════════════════════════════════════════════════════════════
//  VOICE ACTIVITY DETECTION
// ═══════════════════════════════════════════════════════════════════════════
class VAD {
  constructor(opts = {}) {
    this.threshold         = opts.threshold         ?? 0.012;
    this.silenceDuration   = opts.silenceDuration   ?? 1300;
    this.minSpeechDuration = opts.minSpeechDuration ?? 350;
    this.onSpeechStart     = opts.onSpeechStart     ?? (() => {});
    this.onSpeechEnd       = opts.onSpeechEnd       ?? (() => {});
    this.onVolume          = opts.onVolume          ?? (() => {});

    this._active    = false;
    this._paused    = false;
    this._speaking  = false;
    this.recordingEnabled = true; // se false, monitora RMS ma non avvia il recorder
    this._speechStart      = null;
    this._briefSilence     = null; // breve dip sotto soglia durante potenziale speech
    this._silenceStart     = null;
    this._chunks    = [];
    this._recorder  = null;
    this._stream    = null;
    this._context   = null;
    this._analyser  = null;
    this._filter    = null;
    this._buffer    = null;
    this._rafId     = null;

    // Noise gate adattivo
    this._noiseFloor      = null;  // stimato durante il silenzio
    this._noiseHistory    = [];    // campioni RMS recenti in silenzio
    this._adaptiveThresh  = null;  // soglia = noiseFloor * multiplier
    this._NOISE_MULT      = CONFIG.vadNoiseMult ?? 2.8;
    this._NOISE_SAMPLES   = 30;
    this._MAX_RECORD_MS   = 12000;
    this._lastSoundTime   = null;
    this._noiseCooldown   = 0;  // non accumulare noise per N ms dopo un discard
  }

  async start() {
    const audioConstraints = {
      echoCancellation:   { ideal: true },
      noiseSuppression:   { ideal: true },
      autoGainControl:    { ideal: true },
    };
    this._stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
    // Verifica supporto effettivo e avvisa se non disponibile
    const track = this._stream.getAudioTracks()[0];
    if (track) {
      const settings = track.getSettings();
      if (settings.noiseSuppression === false) console.warn('[VAD] noiseSuppression non supportato da questo dispositivo/browser');
      if (settings.echoCancellation === false) console.warn('[VAD] echoCancellation non supportato da questo dispositivo/browser');
    }
    this._context = new AudioContext();
    const source  = this._context.createMediaStreamSource(this._stream);

    // Filtro passa-banda voce umana (300–3400 Hz)
    this._filter = this._context.createBiquadFilter();
    this._filter.type = 'bandpass';
    this._filter.frequency.value = 1700;  // centro banda
    this._filter.Q.value = 0.8;

    this._analyser = this._context.createAnalyser();
    this._analyser.fftSize = 512;

    source.connect(this._filter);
    this._filter.connect(this._analyser);

    this._buffer = new Float32Array(this._analyser.fftSize);

    this._recorder = new MediaRecorder(this._stream);
    this._recorder.ondataavailable = e => { if (e.data.size > 0) this._chunks.push(e.data); };
    this._recorder.onstop = () => {
      const blob = new Blob(this._chunks, { type: 'audio/webm' });
      this._chunks = [];
      this.onSpeechEnd(blob);
    };

    this._active = true;
    this._tick();
  }

  pause()  { this._paused = true;  if (this._speaking) this._forceStop(); }
  resume() { this._paused = false; }

  stop() {
    this._active = false;
    if (this._rafId) cancelAnimationFrame(this._rafId);
    if (this._recorder?.state === 'recording') this._forceStop();
    this._stream?.getTracks().forEach(t => t.stop());
    this._context?.close();
  }

  _getRMS() {
    this._analyser.getFloatTimeDomainData(this._buffer);
    let sum = 0;
    for (let i = 0; i < this._buffer.length; i++) sum += this._buffer[i] ** 2;
    return Math.sqrt(sum / this._buffer.length);
  }

  _forceStop() {
    this._speaking     = false;
    this._speechStart  = null;
    this._briefSilence = null;
    this._silenceStart = null;
    if (this._recorder.state === 'recording') this._recorder.stop();
  }

  _tick() {
    if (!this._active) return;
    this._rafId = requestAnimationFrame(() => this._tick());

    const rms = this._getRMS();
    this.onVolume(rms);

    if (this._paused) return;

    const now = Date.now();

    // Aggiorna stima rumore di fondo (solo in silenzio confermato)
    if (!this._speaking && !this._speechStart && now >= this._noiseCooldown) {
      if (this._lastSoundTime && now - this._lastSoundTime > 30000) {
        this._noiseHistory = [];
        this._noiseFloor   = null;
        this._adaptiveThresh = null;
        this._lastSoundTime  = null;
      }
      this._noiseHistory.push(rms);
      if (this._noiseHistory.length > this._NOISE_SAMPLES) this._noiseHistory.shift();
      if (this._noiseHistory.length >= 10) {
        const sorted = [...this._noiseHistory].sort((a, b) => a - b);
        this._noiseFloor = sorted[Math.floor(sorted.length * 0.75)];
        this._adaptiveThresh = Math.max(this.threshold, this._noiseFloor * this._NOISE_MULT);
      }
    } else if (this._speaking || this._speechStart) {
      this._lastSoundTime = now;
    }
    const activeThresh = this._adaptiveThresh ?? this.threshold;

    if (!this._speaking) {
      if (rms > activeThresh) {
        this._briefSilence = null; // cancella eventuale dip breve
        if (!this._speechStart) {
          this._speechStart = now;
          if (this.recordingEnabled) {
            this._chunks = [];
            if (this._recorder.state === 'inactive') this._recorder.start();
          }
        }
        if (now - this._speechStart >= this.minSpeechDuration) {
          this._speaking = true;
          this._silenceStart = null;
          this.onSpeechStart();
        }
      } else if (this._speechStart) {
        // Dip sotto soglia: aspetta 80ms prima di considerare "troppo breve"
        // così le oscillazioni naturali della voce non azzerano il contatore
        if (!this._briefSilence) this._briefSilence = now;
        if (now - this._briefSilence >= 80) {
          // Silenzio confermato: scarta
          this._speechStart  = null;
          this._briefSilence = null;
          this._noiseCooldown = now + 500;
          if (this._recorder.state === 'recording') {
            this._recorder.ondataavailable = () => {};
            this._recorder.stop();
            this._recorder.ondataavailable = e => { if (e.data.size > 0) this._chunks.push(e.data); };
          }
          this._chunks = [];
        }
      }
    } else {
      // Limite massimo durata registrazione
      if (this._speechStart && now - this._speechStart >= this._MAX_RECORD_MS) {
        this._speaking = false;
        this._silenceStart = null;
        this._speechStart  = null;
        if (this._recorder.state === 'recording') this._recorder.stop();
        return;
      }
      if (rms < activeThresh) {
        if (!this._silenceStart) this._silenceStart = now;
        if (now - this._silenceStart >= this.silenceDuration) {
          this._speaking = false;
          this._silenceStart = null;
          this._speechStart  = null;
          if (this._recorder.state === 'recording') this._recorder.stop();
        }
      } else {
        this._silenceStart = null;
      }
    }
  }
}

let _lastVolume = 0;

// ═══════════════════════════════════════════════════════════════════════════
//  WAKE WORD DETECTION (Web Speech API)
// ═══════════════════════════════════════════════════════════════════════════
function _buildWakeWords() {
  // Se l'utente ha configurato wake word custom, usale
  if (CONFIG.wakeWords) {
    const name = (CONFIG.avatarName || '').toLowerCase().trim();
    const custom = CONFIG.wakeWords.split(',')
      .map(w => w.trim().toLowerCase().replace(/\{\{nome\}\}/g, name))
      .filter(Boolean);
    if (custom.length) return custom;
  }
  // Fallback: genera automaticamente dal nome avatar
  const name = (CONFIG.avatarName || '').toLowerCase().trim();
  if (!name) return [];
  const prefixes = ['ciao', 'hey', 'ok'];
  const words = [name];
  for (const p of prefixes) words.push(`${p} ${name}`);
  return words;
}

function startWakeWord() {
  if (!CONFIG.wakeWordEnabled && !CONFIG.wakeWordAlwaysRequired) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { console.warn('[WakeWord] Web Speech API non supportata'); return; }
  if (state.wakeRecognition) { console.log('[WakeWord] già attiva'); return; }
  console.log('[WakeWord] avvio, mode:', state.mode);

  const rec = new SR();
  rec.lang = 'it-IT';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 3;
  state.wakeRecognition = rec;

  const wakeWords = _buildWakeWords();

  const _wwParts = new Set(wakeWords.flatMap(w => w.split(/\s+/)));
  const _norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

  // Estrae solo le parole DOPO la wake word, scartando tutto ciò che precede
  const _afterWake = text => {
    const words = text.split(/\s+/);
    let end = -1;
    for (const w of wakeWords) {
      const ww = w.split(/\s+/);
      for (let k = 0; k <= words.length - ww.length; k++) {
        if (ww.every((p, j) => words[k + j] === p)) end = Math.max(end, k + ww.length);
      }
    }
    return (end >= 0 ? words.slice(end) : words).filter(w => w && !_wwParts.has(w)).join(' ').trim();
  };

  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const isFinal = e.results[i].isFinal;
      const text = e.results[i][0].transcript.toLowerCase().trim();
      if (!text) continue;

      const textWords = text.split(/\s+/);
      const wakeMatch = wakeWords.some(w => {
        const ww = w.split(/\s+/);
        return textWords.some((_, k) => ww.every((p, j) => textWords[k + j] === p));
      });

      // ── Attivazione da idle ──────────────────────────────────────────────
      if (wakeMatch && state.mode === 'idle') {
        stopWakeWord();
        wakeUp();
        return;
      }

      // ── Wake word durante speaking → interrompi e attiva registrazione ─────
      if (wakeMatch && state.mode === 'speaking' && CONFIG.wakeWordAlwaysRequired) {
        stopCurrentAudio();
        state.wakeActivated = true;
        setMode('recording');
        clearTimeout(state._wakeTimeout);
        state._wakeTimeout = setTimeout(() => {
          if (state.mode === 'recording' && state.wakeActivated) {
            state.wakeActivated = false;
            setMode('listening');
          }
        }, CONFIG.vadWakeTimeout);
        if (isFinal) {
          const content = _afterWake(_norm(text.replace(/[.,!?']/g, '')));
          if (content) {
            state.wakeActivated = false;
            clearTimeout(state._wakeTimeout);
            setMode('thinking');
            processUserInput(content);
          }
        }
        return;
      }

      // ── Wake word in ascolto → attiva registrazione ──────────────────────
      if (wakeMatch && state.mode === 'listening' && CONFIG.wakeWordAlwaysRequired) {
        if (!state.wakeActivated) {
          state.wakeActivated = true;
          setMode('recording');
          clearTimeout(state._wakeTimeout);
          state._wakeTimeout = setTimeout(() => {
            if (state.mode === 'recording' && state.wakeActivated) {
              state.wakeActivated = false;
              setMode('listening');
            }
          }, CONFIG.vadWakeTimeout);
        }
        // Controlla se c'è già una domanda nella stessa utterance (final)
        if (isFinal) {
          const content = _afterWake(_norm(text.replace(/[.,!?']/g, '')));
          if (content) {
            state.wakeActivated = false;
            clearTimeout(state._wakeTimeout);
            setMode('thinking');
            processUserInput(content);
          }
        }
        return;
      }

      // ── Domanda dopo wake word (utterance successiva o finale con wake+domanda) ─
      if (state.mode === 'recording' && state.wakeActivated && CONFIG.wakeWordAlwaysRequired && isFinal) {
        const content = _afterWake(_norm(text.replace(/[.,!?']/g, '')));
        if (content) {
          state.wakeActivated = false;
          clearTimeout(state._wakeTimeout);
          setMode('thinking');
          processUserInput(content);
        }
        // se content è vuoto: solo wake word ripetuta, resta in recording
        return;
      }
    }
  };

  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    console.warn('[WakeWord] errore:', e.error);
  };

  rec.onend = () => {
    if (rec !== state.wakeRecognition) return; // istanza stale, non riavviare
    const shouldRestart =
      (state.mode === 'idle' ||
       (CONFIG.wakeWordAlwaysRequired && (state.mode === 'listening' || state.mode === 'speaking' || state.mode === 'recording' || state.mode === 'thinking')));
    if (shouldRestart) {
      const delay = state.mode === 'recording' ? 50 : 300;
      setTimeout(() => { try { rec.start(); } catch(e) {} }, delay);
    }
  };

  try { rec.start(); } catch(e) { console.warn('[WakeWord] start fallito:', e.message); }
}

function stopWakeWord() {
  if (!state.wakeRecognition) return;
  try { state.wakeRecognition.abort(); } catch(_) {}
  state.wakeRecognition = null;
}

// ═══════════════════════════════════════════════════════════════════════════
//  ANIMAZIONE PROCEDURALE + LIP SYNC
// ═══════════════════════════════════════════════════════════════════════════

// Stato animazione
const anim = {
  breathPhase: 0,
  floatPhase:  0,
  wobblePhase: 0,

  // Rotazione modello intero (gesture globali)
  cur: { rx: 0, ry: 0, rz: 0 },
  tgt: { rx: 0, ry: 0, rz: 0 },

  // Rotazione head bone (gesture testa)
  head: { rx: 0, ry: 0, rz: 0 },
  headTgt: { rx: 0, ry: 0, rz: 0 },

  // Timing gesture
  nextGestureIn:  3000,
  lastGestureAt:  0,
  gestureReturnAt: 0,

  // Lip sync (rotazione X head = apertura bocca)
  lipTarget:  0,
  lipCurrent: 0,

  baseY: 0,
  bones: {},        // popolato dopo caricamento GLB
  morphMesh:   null, // mesh con morph target jawOpen
  morphJawIdx: -1,   // indice morph target
};

// Gestures testa: [rx, ry, rz, durata ms]
const GESTURES = [
  [ 0.12,  0.00,  0.00, 500],   // annuisce
  [-0.08,  0.00,  0.00, 450],   // guarda su
  [ 0.05,  0.25,  0.00, 650],   // guarda sinistra
  [ 0.05, -0.25,  0.00, 650],   // guarda destra
  [ 0.08,  0.15,  0.06, 550],   // inclina sinistra
  [ 0.08, -0.15, -0.06, 550],   // inclina destra
  [ 0.00,  0.00,  0.00, 400],   // neutro (pausa)
];

function triggerRandomGesture() {
  const g = GESTURES[Math.floor(Math.random() * GESTURES.length)];
  anim.headTgt = { rx: g[0], ry: g[1], rz: g[2] };
  anim.gestureReturnAt = Date.now() + g[3];
}

function startRenderLoop() {
  const clock = new THREE.Clock();

  // Salva Y base del modello dopo il posizionamento
  if (state.avatar) anim.baseY = state.avatar.position.y;

  (function tick() {
    requestAnimationFrame(tick);
    const delta = clock.getDelta();
    const now   = Date.now();

    if (state.avatar) {
      anim.breathPhase += delta * 0.35;
      anim.floatPhase  += delta * 0.55;
      anim.wobblePhase += delta * 1.8;

      // ── Animazioni idle ───────────────────────────────
      const breath = Math.sin(anim.breathPhase) * 0.006;
      const float  = Math.sin(anim.floatPhase)  * 0.035;

      // ── Gesture random ────────────────────────────────
      if (now - anim.lastGestureAt > anim.nextGestureIn) {
        anim.lastGestureAt = now;
        anim.nextGestureIn = 3500 + Math.random() * 4500;
        triggerRandomGesture();
      }
      if (now > anim.gestureReturnAt) {
        anim.headTgt = { rx: 0, ry: 0, rz: 0 };
      }

      // Interpolazione smooth testa
      const lerp = 1 - Math.pow(0.04, delta);
      anim.head.rx += (anim.headTgt.rx - anim.head.rx) * lerp;
      anim.head.ry += (anim.headTgt.ry - anim.head.ry) * lerp;
      anim.head.rz += (anim.headTgt.rz - anim.head.rz) * lerp;

      // ── Lip sync ──────────────────────────────────────
      anim.lipCurrent += (anim.lipTarget - anim.lipCurrent) * 0.25;

      state.avatar.position.y = anim.baseY;
    }

    // Controllo range animazione (disabilitato durante scrub admin)
    if (state.mainAction && !state._isScrubbing && !state._adminScrubbing && state._fullClip) {
      const dur = state._fullClip.duration;

      // Preview loop dall'admin ha priorità
      const raw = state._isPreviewLooping && state._previewRange
        ? state._previewRange
        : state.mode === 'speaking'
          ? { start: ANIM_RANGE.speechStart, end: ANIM_RANGE.speechEnd }
          : { start: ANIM_RANGE.idleStart,   end: ANIM_RANGE.idleEnd };

      const r = { start: Math.min(raw.start, dur), end: Math.min(raw.end, dur) };

      if (r.start < r.end) {
        const t = state.mainAction.time;
        if (CONFIG.animPingPong) {
          if (t < r.start) {
            state.mainAction.timeScale = 1;
            state.mainAction.time = r.start;
          } else if (t >= r.end) {
            state.mainAction.timeScale = -1;
            state.mainAction.time = r.end - 0.001;
          }
        } else {
          state.mainAction.timeScale = 1;
          if (t < r.start || t >= r.end) state.mainAction.time = r.start;
        }
      }
    }

    // Mixer principale (saltato durante scrub)
    if (state.mixer && !state._isScrubbing) state.mixer.update(delta);
    // Mixer scrub
    if (state._scrubMixer && state._isScrubbing && _scrubPlaying) state._scrubMixer.update(delta);

    if (!state._isScrubbing && state.avatar) {
      const talking = state.mode === 'speaking' ? anim.lipCurrent : 0;

      // ── Lip sync: priorità jaw bone → morph target → head rotation ──
      if (anim.bones.jaw) {
        // Opzione A: jaw bone — rotazione X
        anim.bones.jaw.rotation.x = talking * 0.35 * Math.abs(Math.sin(anim.wobblePhase));
      } else if (anim.morphMesh) {
        // Opzione B: morph target jawOpen
        anim.morphMesh.morphTargetInfluences[anim.morphJawIdx] =
          talking * Math.abs(Math.sin(anim.wobblePhase));
      } else if (anim.bones.head) {
        // Fallback: rotazione testa
        const lipRot = talking * 0.22 * Math.abs(Math.sin(anim.wobblePhase));
        anim.bones.head.rotation.x += anim.head.rx + lipRot;
        anim.bones.head.rotation.y += anim.head.ry;
        anim.bones.head.rotation.z += anim.head.rz;
      }

      // Gesture testa (solo se non gestita dal lip sync con head)
      if (anim.bones.head && (anim.bones.jaw || anim.morphMesh)) {
        anim.bones.head.rotation.x += anim.head.rx;
        anim.bones.head.rotation.y += anim.head.ry;
        anim.bones.head.rotation.z += anim.head.rz;
      }

      // Respiro spine
      if (anim.bones.spine) {
        const breath = Math.sin(anim.breathPhase) * 0.006;
        anim.bones.spine.rotation.x += breath * 2;
      }
    }

    // Resize dinamico
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    renderer.render(scene, camera);
    // Nasconde lo spinner al primo frame effettivamente renderizzato
    const loader = document.getElementById('avatar-loader');
    if (loader && !loader.classList.contains('hidden')) {
      loader.classList.add('hidden');
    }
  })();
}

// ── Forza una gesture dall'esterno (es. quando parla) ────────────────────
function triggerTalkingGesture() {
  const talking = [
    [0.05,  0.08, 0.00, 400],
    [0.08,  0.00, 0.02, 500],
    [0.04, -0.10, 0.00, 450],
  ];
  const g = talking[Math.floor(Math.random() * talking.length)];
  anim.headTgt = { rx: g[0], ry: g[1], rz: g[2] };
  anim.gestureReturnAt = Date.now() + g[3];
}

// ═══════════════════════════════════════════════════════════════════════════
//  LIP SYNC — guida anim.lipTarget tramite audio
// ═══════════════════════════════════════════════════════════════════════════
let _lipAudioCtx = null;
let _iosAudioSrc = null;
const _isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

function _b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function handleSayMessage(text) {
  try {
    stopCurrentAudio();
    addToHistory('avatar', text);
    setMode('speaking');
    state.vad?.resume();

    const ttsRes = await fetch(`${CONFIG.serverUrl}/api/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, avatarId: CONFIG.avatarId }),
    });
    if (ttsRes.ok) {
      const ttsData = await ttsRes.json();
      if (CONFIG.audioEnabled) {
        startProceduralLipSync();
        await playTTSAudio(ttsData);
      }
    }
  } catch (e) {
    console.error('[say]', e);
  } finally {
    stopProceduralLipSync();
    anim.lipTarget = 0;
    state.vad?.resume();
    if (state.mode !== 'thinking') setMode('listening');
    resetIdleTimer();
  }
}

async function playTTSAudio(ttsData) {
  if (_isIOS) {
    // Su iOS: decodifica e riproduce via AudioContext (sbloccato in wakeUp durante il gesto)
    try {
      if (_lipAudioCtx?.state === 'suspended') await _lipAudioCtx.resume().catch(() => {});
      const buf = await _lipAudioCtx.decodeAudioData(_b64ToArrayBuffer(ttsData.audio));
      if (_iosAudioSrc) { try { _iosAudioSrc.stop(); } catch(_){} }
      _iosAudioSrc = _lipAudioCtx.createBufferSource();
      _iosAudioSrc.buffer = buf;
      _iosAudioSrc.connect(_lipAudioCtx.destination);
      state.currentAudio = { pause: () => { try { _iosAudioSrc?.stop(); } catch(_){} }, _ios: true };
      await new Promise(resolve => {
        _iosAudioSrc.onended = resolve;
        _iosAudioSrc.start(0);
      });
    } catch (e) { console.warn('iOS audio error', e); }
    if (state.currentAudio?._ios) state.currentAudio = null;
    return;
  }
  // Desktop: HTMLAudioElement
  const audio = new Audio(`data:audio/mpeg;base64,${ttsData.audio}`);
  audio.volume = CONFIG.ttsVolume ?? 1.0;
  state.currentAudio = audio;
  if (_lipAudioCtx?.state === 'suspended') await _lipAudioCtx.resume().catch(() => {});
  await new Promise(resolve => {
    audio.addEventListener('ended', resolve, { once: true });
    audio.addEventListener('error', resolve, { once: true });
    startLipSync(audio, ttsData.alignment);
    audio.play().catch(resolve);
  });
  if (state.currentAudio === audio) state.currentAudio = null;
}

function startLipSync(audioEl, alignment) {
  // Con alignment ElevenLabs: vocali → bocca aperta
  if (alignment?.chars) {
    const { chars, char_start_times_seconds, char_durations_seconds } = alignment;
    (function update() {
      if (audioEl.paused || audioEl.ended) { anim.lipTarget = 0; return; }
      const t = audioEl.currentTime;
      for (let i = 0; i < chars.length; i++) {
        if (t >= char_start_times_seconds[i] && t < char_start_times_seconds[i] + char_durations_seconds[i]) {
          const isVowel = 'aeiouàèéìòù'.includes(chars[i].toLowerCase());
          anim.lipTarget = isVowel ? 0.75 + Math.random() * 0.25 : 0.12;
          // Gesture occasionale mentre parla
          if (Math.random() < 0.02) triggerTalkingGesture();
          break;
        }
      }
      requestAnimationFrame(update);
    })();
    return;
  }

  // Fallback: analisi frequenze vocali (300–3000 Hz)
  // Su iOS createMediaElementSource cattura l'audio e lo muta se il contesto è sospeso
  if (_isIOS) { startProceduralLipSync(); return; }
  if (!_lipAudioCtx) _lipAudioCtx = new AudioContext();
  if (_lipAudioCtx.state === 'suspended') { startProceduralLipSync(); return; }
  let source, analyser;
  try {
    source   = _lipAudioCtx.createMediaElementSource(audioEl);
    analyser = _lipAudioCtx.createAnalyser();
  } catch (_) { startProceduralLipSync(); return; }
  analyser.fftSize = 256;
  source.connect(analyser);
  analyser.connect(_lipAudioCtx.destination);
  const data = new Uint8Array(analyser.frequencyBinCount);

  (function update() {
    if (audioEl.paused || audioEl.ended) { anim.lipTarget = 0; return; }
    analyser.getByteFrequencyData(data);
    const s = Math.floor(300  / (_lipAudioCtx.sampleRate / analyser.fftSize));
    const e = Math.floor(3000 / (_lipAudioCtx.sampleRate / analyser.fftSize));
    let sum = 0;
    for (let i = s; i < e; i++) sum += data[i];
    anim.lipTarget = Math.min((sum / (e - s)) / 100, 1);
    if (Math.random() < 0.015) triggerTalkingGesture();
    requestAnimationFrame(update);
  })();
}

  thinking:  {},
  speaking:  {},

function _updateMicBtnMode(mode) {
  if (CONFIG.pttEnabled) return; // in modalità PTT il mic non è visibile
  const btn = document.getElementById('mic-btn');
  if (!btn || CONFIG.micVisible === false) return;
  const _alphaOf = c => { const m = c.match(/[\d.]+\)$/); return m ? Math.round(parseFloat(m[0]) * 100) : 15; };
  if (mode === 'listening') {
    // Wakeword rilevata, in attesa di voce: colore tema
    const bg  = CONFIG.micBgColor  || 'rgba(34,211,160,.15)';
    const brd = CONFIG.micBorderColor || 'rgba(34,211,160,.5)';
    btn.style.background  = `color-mix(in srgb, var(--accent) ${_alphaOf(bg)}%, transparent)`;
    btn.style.borderColor = `color-mix(in srgb, var(--accent) ${_alphaOf(brd)}%, transparent)`;
  } else if (mode !== 'recording' && mode !== 'listening') {
    // Tutti gli altri stati tranne recording (che è gestito da setMicWaveVisible):
    // ripristina colori configurati
    if (CONFIG.micEnabled) {
      btn.style.background  = CONFIG.micBgColor     || 'rgba(34,211,160,.15)';
      btn.style.borderColor = CONFIG.micBorderColor || 'rgba(34,211,160,.5)';
    } else {
      btn.style.background  = CONFIG.micDisabledColor       || 'rgba(248,113,113,.15)';
      btn.style.borderColor = CONFIG.micBorderDisabledColor || 'rgba(248,113,113,.4)';
    }
  }
}

function setMode(mode) {
  state.mode = mode;

  setMicWaveVisible(CONFIG.micEnabled && (mode === 'recording' || mode === 'listening'));
  setAudioWaveVisible(CONFIG.audioEnabled && mode === 'speaking');
  if (CONFIG.pttEnabled) { updatePttBtn(); }
  _updateMicBtnMode(mode);

  if (ACTIVE_MODES.has(mode)) {
    // Qualsiasi attività: ferma il conto alla rovescia
    clearTimeout(_idleTimer);
    _idleTimer = null;
  } else if (mode === 'idle') {
    // già in standby, niente da fare
  }

}

// ═══════════════════════════════════════════════════════════════════════════
//  PIPELINE PRINCIPALE
// ═══════════════════════════════════════════════════════════════════════════
let _idleTimer = null;

function resetIdleTimer() {
  if (CONFIG.idleDisabled) return;
  clearTimeout(_idleTimer);
  _idleTimer = setTimeout(() => {
    document.getElementById('idle-overlay').classList.remove('hidden');
    setControlsVisible(false);
    document.getElementById('chat-history').innerHTML = '';
    setMode('idle');
    state.vad?.pause();
    if (CONFIG.wakeWordEnabled) startWakeWord();
  }, CONFIG.idleTimeout);
}

function stripMarkdown(text) {
  return text
    .replace(/#{1,6}\s*/g, '')           // titoli
    .replace(/\*\*(.+?)\*\*/g, '$1')     // grassetto
    .replace(/\*(.+?)\*/g, '$1')         // corsivo
    .replace(/__(.+?)__/g, '$1')
    .replace(/_(.+?)_/g, '$1')
    .replace(/`{1,3}[^`]*`{1,3}/g, '')  // codice
    .replace(/\[(.+?)\]\(.+?\)/g, '$1') // link
    .replace(/^\s*[-*+]\s+/gm, '')      // liste
    .replace(/^\s*\d+\.\s+/gm, '')      // liste numerate
    .replace(/\n{2,}/g, ' ')
    .trim();
}

function addToHistory(role, text) {
  const history = document.getElementById('chat-history');
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.alignItems = role === 'user' ? 'flex-end' : 'flex-start';
  wrap.style.marginBottom = '10px';

  const bubble = document.createElement('div');
  bubble.className = role === 'user' ? 'transcript-bubble' : 'response-bubble-hist';

  if (role !== 'user') {
    const lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = CONFIG.avatarName?.toUpperCase() || 'SOFIA';
    bubble.appendChild(lbl);
  }
  const content = document.createElement('div');
  content.className = 'bubble-content';
  if (role === 'user') {
    content.textContent = text;
  } else {
    content.innerHTML = marked.parse(text);
  }
  bubble.appendChild(content);
  wrap.appendChild(bubble);
  history.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

async function processUserInput(text) {
  if (!text?.trim()) return;
  state.vad?.pause();

  // Nasconde il bubble di benvenuto al primo messaggio
  document.getElementById('response-bubble').style.display = 'none';

  // Aggiunge messaggio utente alla cronologia
  addToHistory('user', text);

  setMode('thinking');
  document.getElementById('typing').classList.add('visible');
  _userScrolledUp = false;
  scrollToBottom();

  try {
    // ── 1. Claude ────────────────────────────────────────────────────────
    const chatRes = await fetch(`${CONFIG.serverUrl}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: state.sessionId, avatarId: CONFIG.avatarId, kioskSessionId: state.kioskSessionId }),
    });
    const chatData = await chatRes.json();
    if (!chatRes.ok) throw new Error(chatData.error);

    state.sessionId = chatData.sessionId;

    // ── 2. TTS ───────────────────────────────────────────────────────────
    const ttsRes = await fetch(`${CONFIG.serverUrl}/api/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: chatData.reply, avatarId: CONFIG.avatarId }),
    });

    // Mostra risposta nella cronologia quando ElevenLabs ha risposto
    document.getElementById('typing').classList.remove('visible');
    addToHistory('avatar', chatData.reply);
    setMode('speaking');
    state.vad?.resume();

    if (ttsRes.ok) {
      const ttsData = await ttsRes.json();
      stopCurrentAudio();
      if (CONFIG.audioEnabled) {
        startProceduralLipSync();
        await playTTSAudio(ttsData);
      }
    } else {
      const ttsErr = await ttsRes.json().catch(() => ({}));
      if (ttsErr.error === 'quota_exceeded') {
        addToHistory('avatar', '⚠️ Crediti vocali esauriti. Ricarica il piano ElevenLabs per ripristinare l\'audio.');
      }
    }

  } catch (err) {
    document.getElementById('typing').classList.remove('visible');
    addToHistory('avatar', `⚠️ ${err.message}`);
  } finally {
    stopProceduralLipSync();
    anim.lipTarget = 0;

    const wasBargeIn = state.bargeIn;
    state.bargeIn = false;
    state.vad?.resume();

    if (wasBargeIn && !CONFIG.wakeWordAlwaysRequired) {
      // Casi 1,2,5,6: barge-in VAD free-talk — recorder sta catturando, non toccare nulla
    } else if (state.wakeActivated) {
      // Casi 3,4: barge-in wake word — in attesa della domanda (setTimeout già pianificato)
    } else {
      // Fine turno normale: torna in ascolto
      if (state.mode !== 'thinking') setMode('listening');
      state.wakeActivated = false;
      if (CONFIG.wakeWordAlwaysRequired && state.vad) state.vad.recordingEnabled = false;
      if (CONFIG.wakeWordAlwaysRequired) { stopWakeWord(); startWakeWord(); }
    }

    resetIdleTimer();
  }
}

// Lip sync procedurale durante lo streaming (senza audio)
let _proceduralLipInterval = null;
function startProceduralLipSync() {
  _proceduralLipInterval = setInterval(() => {
    anim.lipTarget = 0.3 + Math.random() * 0.7;
  }, 120);
}
function stopProceduralLipSync() {
  clearInterval(_proceduralLipInterval);
  _proceduralLipInterval = null;
  anim.lipTarget = 0;
}

let _userScrolledUp = false;

function scrollToBottom() {
  const area = document.getElementById('response-area');
  if (!_userScrolledUp) {
    area.scrollTop = area.scrollHeight;
  } else {
    document.getElementById('scroll-hint').style.display = 'block';
  }
}

function forceScrollToBottom() {
  const area = document.getElementById('response-area');
  _userScrolledUp = false;
  document.getElementById('scroll-hint').style.display = 'none';
  area.scrollTop = area.scrollHeight;
}

document.addEventListener('DOMContentLoaded', () => {
  const area = document.getElementById('response-area');
  area.addEventListener('scroll', () => {
    const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 60;
    _userScrolledUp = !atBottom;
    if (atBottom) document.getElementById('scroll-hint').style.display = 'none';
  });
  updateMicBtn();
  updateAudioBtn();
  updatePttBtn();
  _initPttListeners();

  document.body.addEventListener('pointerdown', e => {
    if (!CONFIG.touchStopSpeaking) return;
    if (!state.currentAudio) return;
    const tag = e.target?.tagName?.toUpperCase();
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    stopCurrentAudio();
  });
});

async function sendText() {
  const input = document.getElementById('text-input');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  await processUserInput(text);
}

document.getElementById('text-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// ─── Ferma l'audio corrente e sblocca la Promise ─────────────────────────────
function stopCurrentAudio() {
  stopProceduralLipSync();
  anim.lipTarget = 0;
  if (state.currentAudio) {
    state.currentAudio.pause();
    state.currentAudio.dispatchEvent(new Event('ended')); // risolve la Promise naturalmente
    state.currentAudio = null;
  }
}

//  TRASCRIZIONE AUDIO (STT)
// ═══════════════════════════════════════════════════════════════════════════
const _WHISPER_HALLUCINATIONS = [
  'amara.org', 'sottotitoli creati da', 'sottotitoli di', 'sottotitoli a cura di', 'sub ita',
  'transcribed by', 'subtitles by', 'translated by', 'www.', '.com', '.org',
  'grazie per aver guardato', 'iscriviti al canale',
];

function _isHallucination(text) {
  const lower = text.toLowerCase();
  // Frasi note di allucinazione Whisper
  if (_WHISPER_HALLUCINATIONS.some(h => lower.includes(h))) return true;
  const words = lower.replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean);
  if (words.length < 4) return false;
  // Parola singola ripetuta più del 40%
  const freq = {};
  for (const w of words) freq[w] = (freq[w] || 0) + 1;
  const maxFreq = Math.max(...Object.values(freq));
  if (maxFreq / words.length > 0.4) return true;
  // Sequenza di 3 parole ripetuta
  for (let i = 0; i < words.length - 5; i++) {
    const tri = words.slice(i, i + 3).join(' ');
    if (words.slice(i + 3).join(' ').includes(tri)) return true;
  }
  return false;
}

async function transcribeAndProcess(blob) {
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  if (CONFIG.avatarId) formData.append('avatarId', CONFIG.avatarId);
  if (CONFIG.sttPrompt) formData.append('sttPrompt', CONFIG.sttPrompt);

  try {
    const res  = await fetch(`${CONFIG.serverUrl}/api/stt`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const transcript = data.transcript?.trim();
    if (transcript && !_isHallucination(transcript)) {
      // Scarta trascrizioni composte solo da parole della wake word
      if (CONFIG.wakeWordEnabled || CONFIG.wakeWordAlwaysRequired) {
        const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
        const t = norm(transcript.toLowerCase().replace(/[.,!?']/g, '').trim());
        const wakeWordParts = new Set(_buildWakeWords().flatMap(w => norm(w).split(/\s+/)));
        const contentWords = t.split(/\s+/).filter(w => w && !wakeWordParts.has(w));
        if (contentWords.length === 0) {
          // wakeActivated=true: la prossima frase parte senza richiedere di nuovo la wake word
          state.wakeActivated = true;
          state.vad?.resume();
          setMode('listening');
          if (CONFIG.wakeWordAlwaysRequired) startWakeWord();
          resetIdleTimer();
          clearTimeout(state._wakeTimeout);
          state._wakeTimeout = setTimeout(() => {
            if (state.mode === 'listening' && state.wakeActivated) {
              state.wakeActivated = false;
            }
          }, CONFIG.vadWakeTimeout);
          return;
        }
      }
      await processUserInput(transcript);
    } else {
      // Trascrizione vuota o allucinazione: pausa prima di riascoltare
      state._hallucCount = (state._hallucCount || 0) + 1;
      clearTimeout(state._hallucReset);
      state._hallucReset = setTimeout(() => { state._hallucCount = 0; }, 10000);
      // Più allucinazioni consecutive → pausa più lunga (max 5s)
      const cooldown = Math.min(1500 * state._hallucCount, 5000);
      setMode('listening');
      setTimeout(() => { state.vad?.resume(); }, cooldown);
      resetIdleTimer();
    }
  } catch (err) {
    document.getElementById('response-text').textContent = `⚠️ Errore trascrizione: ${err.message}`;
    document.getElementById('response-bubble').style.display = 'block';
    setMode('listening');
    setTimeout(() => { state.vad?.resume(); }, 1500);
    resetIdleTimer();
  }
}

// defaultRight: posizione right di default (px) per separare i due bottoni
function applyIconLayout(btnId, imgId, size, x, y, defaultRight, defaultTop=16) {
  const btn = document.getElementById(btnId);
  const img = document.getElementById(imgId);
  if (!btn) return;
  btn.style.width  = size + 'px';
  btn.style.height = size + 'px';
  // posizioni in vw/vh (calibrate su 1080×1920)
  btn.style.top    = ((defaultTop + y) / 1920 * 100) + 'vh';
  btn.style.left   = '';
  btn.style.right  = ((defaultRight - x) / 1080 * 100) + 'vw';
  if (img) {
    const imgSize = Math.round(size * 0.64);
    img.style.width  = imgSize + 'px';
    img.style.height = imgSize + 'px';
  }
}

function _applyDisabledIcon(imgId, path, fallbackId) {
  const img = document.getElementById(imgId);
  if (!img) return;
  if (path) {
    img.src = '/' + path + '?t=' + (CONFIG._iconTs || '');
    img.style.display = 'block';
    const fb = document.getElementById(fallbackId);
    if (fb) fb.style.display = 'none';
  } else {
    img.style.display = 'none';
  }
}

function _applyIconToBtn(imgId, fallbackId, path) {
  const img      = document.getElementById(imgId);
  const fallback = document.getElementById(fallbackId);
  if (!img) return;
  if (path) {
    img.src = '/' + path + '?t=' + (CONFIG._iconTs || '');
    img.style.display = 'block';
    if (fallback) fallback.style.display = 'none';
  } else {
    img.style.display = 'none';
    if (fallback) fallback.style.display = '';
  }
}

function _repositionMobileButtonsAuto(viewportW) {
  const isMobile = (viewportW ?? window.innerWidth) <= 600;
  if (!isMobile) return;
  const micSz = Math.round((CONFIG.micIconSize  ?? 44) * 0.65);
  const audSz = Math.round((CONFIG.audioIconSize ?? 44) * 0.65);
  const pttSz = CONFIG.pttEnabled
    ? Math.round(((CONFIG.pttIconSize ?? 0) || (CONFIG.micIconSize ?? 44)) * 0.65)
    : 0;
  const micVisible = CONFIG.micVisible !== false;
  const audVisible = CONFIG.audioVisible !== false;
  const pttVisible = CONFIG.pttEnabled === true;
  const parts = [
    ...(micVisible ? [micSz] : []),
    ...(audVisible ? [audSz] : []),
    ...(pttVisible ? [pttSz] : []),
  ];
  const totW = parts.reduce((acc, s, i) => acc + s + (i > 0 ? 10 : 0), 0);
  const half = totW / 2;
  const root = document.documentElement;
  // Imposta le CSS custom properties usate dalla media query
  root.style.setProperty('--btn-half-total-w', half + 'px');
  // --audio-mobile-left: posizione left del pulsante audio nel gruppo centrato
  const audLeft = micVisible ? `calc(50% - ${half}px + ${micSz + 10}px)` : `calc(50% - ${half}px)`;
  root.style.setProperty('--audio-mobile-left', audLeft);
  // --ptt-mobile-left: posizione left del pulsante ptt nel gruppo centrato
  let pttCursor = 0;
  if (micVisible) pttCursor += micSz + 10;
  if (audVisible) pttCursor += audSz + 10;
  const pttLeft = `calc(50% - ${half}px + ${pttCursor}px)`;
  root.style.setProperty('--ptt-mobile-left', pttLeft);
  // Ricalcola il fumetto dopo che il browser ha applicato le nuove posizioni CSS
  requestAnimationFrame(() => requestAnimationFrame(() => updateMicBubble()));
}

  _applyIconToBtn('mic-icon-img', 'mic-icon-fallback', useDisabledIcon ? '' : CONFIG.micIcon);

  const mic = document.getElementById('mic-btn');

  const _audSz  = Math.round((CONFIG.audioIconSize ?? 44) * (_isMobile ? 0.65 : 1));
  const _pttSz  = CONFIG.pttEnabled && _isMobile
    ? Math.round(((CONFIG.pttIconSize ?? 0) || (CONFIG.micIconSize ?? 44)) * 0.65)
    : 0;
  const _micVisible = CONFIG.micVisible !== false;
  const _audVisible = CONFIG.audioVisible !== false;
  const _pttVisible = CONFIG.pttEnabled;
  const _parts = [
    ...(_micVisible ? [_micSz] : []),
    ...(_audVisible ? [_audSz] : []),
    ...(_pttVisible && _isMobile ? [_pttSz] : []),
  ];
  const _totW = _parts.reduce((acc, s, i) => acc + s + (i > 0 ? 10 : 0), 0);
  const root = document.documentElement;

  if (_isMobile) {
    const GAP_BTN_INPUT = 16;

  if (mic) {
    mic.style.setProperty('width',  _micSz + 'px', 'important');
    mic.style.setProperty('height', _micSz + 'px', 'important');
    mic.style.top    = `${20 + CONFIG.micIconY}px`;
    mic.style.bottom = '';
    mic.style.right  = micRightVw + 'vw';
    mic.style.left   = '';
    const s = Math.round(_micSz * 0.64);
    const img = document.getElementById('mic-icon-img');
    if (img) { img.style.setProperty('width', s+'px', 'important'); img.style.setProperty('height', s+'px', 'important'); }
    const imgDis = document.getElementById('mic-icon-disabled-img');

  }
  // Posizionamento centrato su mobile: aggiorna le CSS custom properties
  _repositionMobileButtonsAuto();

  if (CONFIG.micEnabled) {

    btn.style.borderColor = CONFIG.micBorderColor || 'rgba(34,211,160,.5)';
    if (img) img.style.filter = 'none';

    btn.style.background  = CONFIG.micDisabledColor       || 'rgba(248,113,113,.15)';
    btn.style.borderColor = CONFIG.micBorderDisabledColor || 'rgba(248,113,113,.4)';
    if (img && !CONFIG.micIconDisabled) img.style.filter = 'grayscale(1)';
    setMicWaveVisible(false);
  }
  updateMicBubble();
}

function updateMicBubble() {
  const bubble = document.getElementById('mic-bubble');
  if (!bubble) return;

  if (!CONFIG.micBubbleVisible || !(CONFIG.micBubbleText || '').trim() || window.innerWidth <= 600) {
    bubble.style.display = 'none';
    _stopBubbleBounce();
    return;
  }

  // Ancora: mic se visibile, altrimenti PTT, altrimenti nascondi
  const micVisible = CONFIG.micVisible !== false;
  const pttVisible = !!CONFIG.pttEnabled;
  const btn = micVisible
    ? document.getElementById('mic-btn')
    : (pttVisible ? document.getElementById('ptt-btn') : null);
  if (!btn) { bubble.style.display = 'none'; return; }

  const BG     = CONFIG.micBubbleBgColor      || 'rgba(255,255,255,0.95)';
  const BORDER = CONFIG.micBubbleBorderColor  || 'transparent';
  const RADIUS = CONFIG.micBubbleBorderRadius ?? 12;
  const filled = (CONFIG.micBubbleText || '').replace(/\{\{nome\}\}/gi, CONFIG.avatarName || '');

  const img = CONFIG.micBubbleBgImage || '';
  const A = 8; // dimensione freccia px

  bubble.innerHTML = img
    ? `<div style="position:absolute;inset:0;border-radius:${RADIUS}px;background:url(/${img}) center/cover no-repeat"></div><span style="position:relative;z-index:1;text-align:center;width:100%">${filled}</span><span class="mb-arrow"></span>`
    : `<span style="text-align:center;width:100%">${filled}</span><span class="mb-arrow"></span>`;

  bubble.style.background   = img ? 'transparent' : BG;
  bubble.style.border       = `1px solid ${BORDER}`;
  bubble.style.borderRadius = RADIUS + 'px';
  bubble.style.fontFamily   = CONFIG.micBubbleFont || 'inherit';
  bubble.style.overflow     = 'visible';

  const _bubMobile = window.innerWidth <= 600;
  const _bubScale  = _bubMobile ? 0.7 : 1;
  bubble.style.fontSize     = Math.round((CONFIG.micBubbleFontSize || 13) * _bubScale) + 'px';
  bubble.style.padding      = _bubMobile ? '5px 8px' : '8px 12px';
  bubble.style.width        = CONFIG.micBubbleWidth  > 0 ? Math.round(CONFIG.micBubbleWidth  * _bubScale) + 'px' : '';
  bubble.style.height       = CONFIG.micBubbleHeight > 0 ? Math.round(CONFIG.micBubbleHeight * _bubScale) + 'px' : '';
  bubble.style.maxWidth     = CONFIG.micBubbleWidth  > 0 ? 'none' : Math.round(190 * _bubScale) + 'px';
  bubble.style.display      = 'flex';

  requestAnimationFrame(() => {
    const br = btn.getBoundingClientRect();
    const bw = bubble.offsetWidth  || 190;
    const bh = bubble.offsetHeight || 48;
    const cx = br.left + br.width  / 2;
    const cy = br.top  + br.height / 2;
    const ox = CONFIG.micBubbleX || 0;
    const oy = CONFIG.micBubbleY ?? -80;

    const left = Math.max(4, cx - bw / 2 + ox);
    const top  = Math.max(4, cy - bh / 2 + oy);
    bubble.style.left = left + 'px';
    bubble.style.top  = top  + 'px';

    // Freccia: punta verso il centro del bottone
    const arr = bubble.querySelector('.mb-arrow');
    if (!arr) return;
    const bcx = left + bw / 2;
    const dx = cx - bcx;
    const dy = cy - (top + bh / 2);
    // Se il fumetto è sopra il bottone (fondo fumetto < centro bottone) → freccia sempre in basso
    const bubbleIsAbove = (top + bh) < cy;
    const bubbleIsBelow = top > cy;
    let as = {};
    if (bubbleIsAbove || bubbleIsBelow || Math.abs(dy) >= Math.abs(dx)) {
      // freccia su top o bottom
      const arrowX = Math.min(Math.max(bw / 2 + dx - A, A), bw - A * 3);
      if (dy > 0) {
        // bottone sotto → freccia in basso
        as = { top: bh + 'px', bottom: 'auto', left: arrowX + 'px', right: 'auto',
          borderLeft: `${A}px solid transparent`, borderRight: `${A}px solid transparent`,
          borderTop: `${A}px solid ${BG}`, borderBottom: 'none' };
      } else {
        // bottone sopra → freccia in alto
        as = { top: (-A) + 'px', bottom: 'auto', left: arrowX + 'px', right: 'auto',
          borderLeft: `${A}px solid transparent`, borderRight: `${A}px solid transparent`,
          borderBottom: `${A}px solid ${BG}`, borderTop: 'none' };
      }
    } else {
      const arrowY = Math.min(Math.max(bh / 2 + dy - A, A), bh - A * 3);
      if (dx > 0) {
        // bottone a destra → freccia a destra
        as = { left: bw + 'px', right: 'auto', top: arrowY + 'px', bottom: 'auto',
          borderTop: `${A}px solid transparent`, borderBottom: `${A}px solid transparent`,
          borderLeft: `${A}px solid ${BG}`, borderRight: 'none' };
      } else {
        // bottone a sinistra → freccia a sinistra
        as = { left: (-A) + 'px', right: 'auto', top: arrowY + 'px', bottom: 'auto',
          borderTop: `${A}px solid transparent`, borderBottom: `${A}px solid transparent`,
          borderRight: `${A}px solid ${BG}`, borderLeft: 'none' };
      }
    }
    Object.assign(arr.style, { position: 'absolute', width: '0', height: '0' }, as);
    _startBubbleBounce();
  });
}

let _bubbleBounceTimer = null;
function _startBubbleBounce() {
  _stopBubbleBounce();
  if (!CONFIG.micBubbleBounce) return;
  _bubbleBounceTimer = setInterval(() => {
    const bubble = document.getElementById('mic-bubble');
    if (!bubble || bubble.style.display === 'none') return;
    bubble.classList.remove('bouncing');
    void bubble.offsetWidth; // forza reflow per riavviare l'animazione
    bubble.classList.add('bouncing');
    setTimeout(() => bubble.classList.remove('bouncing'), 1400);
  }, 30000);
}
function _stopBubbleBounce() {
  clearInterval(_bubbleBounceTimer);
  _bubbleBounceTimer = null;
}
